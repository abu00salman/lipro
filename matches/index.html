<script>
document.getElementById("today-date").textContent =
  new Date().toLocaleDateString("ar-SA-u-ca-gregory", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
  });

/* الوقت الحالي بتوقيت الرياض — لكشف المباريات الجارية الآن */
function riyadhNow(){
  try { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Riyadh" })); }
  catch (e) { return new Date(); }
}

/* "09:00 PM" → دقائق من بداية اليوم */
function toMinutes(t){
  var m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(String(t || ""));
  if (!m) return null;
  var h = Number(m[1]) % 12;
  if (/pm/i.test(m[3])) h += 12;
  return h * 60 + Number(m[2]);
}

/* مباراة بلا نتيجة وبين انطلاقها ونهايتها التقريبية = جارية الآن.
   ومباراة معها score و live:true = نتيجة مباشرة أثناء اللعب. */
var LIVE_WINDOW_MIN = 115;
function isLiveNow(m){
  if (Array.isArray(m.score)) return m.live === true;
  var start = toMinutes(m.time);
  if (start == null) return false;
  var now = riyadhNow();
  var diff = (now.getHours() * 60 + now.getMinutes()) - start;
  return diff >= 0 && diff <= LIVE_WINDOW_MIN;
}

const TEAM_STOP = new Set(['al','fc','sc','cf','ac','as','ss','us','ssc','afc','rc','rcd','ud','sd','club','saudi','de','the',
  'fk','sk','bk','if','ol','og','sv','vfl','vfb','tsg','fsv','bsc','sco','stade','calcio','1899','1904','1909','1910','1913','1846','1893','1900']);
function teamKey(name) {
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((w) => w && !TEAM_STOP.has(w)).join(' ').trim();
}
function arTeam(name, short) {
  const k = teamKey(name);
  if (TEAM_AR[k]) return TEAM_AR[k];
  const words = k.split(' ');
  for (let n = words.length; n >= 1; n--) { const sub = words.slice(0, n).join(' '); if (TEAM_AR[sub]) return TEAM_AR[sub]; }
  return short || name;
}
function riyadhDate(d){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
function riyadhTime12(d){
  return new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', hour12: true }).format(d).toUpperCase();
}
function fetchLeagueDay(code, ymd){
  var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + code + '/scoreboard?dates=' + ymd.replace(/-/g, '') + '&limit=100';
  return fetch(url, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('espn_' + r.status); return r.json(); });
}
/* يدمج المباريات المضافة يدويًا لليوم الحالي مع مباريات المصدر التلقائي */
function mergeExtra(leagues, todayStr){
  leagues = leagues || [];
  EXTRA_MATCHES.filter(function(m){ return m.date === todayStr; }).forEach(function(m){
    var same = leagues.filter(function(l){ return l.name === m.league; })[0];
    var entry = { time: m.time, home: m.home, away: m.away };
    if (m.watch) entry.watch = m.watch;
    if (m.channel) entry.channel = m.channel;
    if (m.commentator) entry.commentator = m.commentator;
    if (m.score) { entry.score = m.score; if (m.live) entry.live = true; }
    if (m.note) entry.note = m.note;
    if (same) {
      var dup = same.matches.some(function(x){ return x.home === entry.home && x.away === entry.away; });
      if (!dup) same.matches.push(entry);
    } else {
      leagues.unshift({ name: m.league, badge: m.badge || '⚽', featured: !!m.featured, matches: [entry] });
    }
  });
  /* البطولات المميزة (مثل كأس الخليج) دائمًا في أعلى القائمة */
  leagues.sort(function(a, b){ return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });
  return leagues;
}

function buildFromEspn(results, todayStr){
  var leagues = [];
  MATCH_LEAGUES.forEach(function(lg, i){
    var res = results[i];
    if (!res || res.status !== 'fulfilled' || !res.value || !Array.isArray(res.value.events)) return;
    var matches = [];
    res.value.events.forEach(function(ev){
      var when = new Date(ev.date);
      if (isNaN(when.getTime()) || riyadhDate(when) !== todayStr) return;
      var comp = (ev.competitions && ev.competitions[0]) || {};
      var comps = comp.competitors || [];
      var home = comps.filter(function(c){ return c.homeAway === 'home'; })[0] || comps[0];
      var away = comps.filter(function(c){ return c.homeAway === 'away'; })[0] || comps[1];
      if (!home || !away) return;
      var st = (ev.status && ev.status.type) || {};
      var m = {
        time: riyadhTime12(when),
        home: arTeam(home.team && home.team.displayName, home.team && home.team.shortDisplayName),
        away: arTeam(away.team && away.team.displayName, away.team && away.team.shortDisplayName),
        _ts: when.getTime()
      };
      if (st.state === 'in') {
        m.score = [Number(home.score) || 0, Number(away.score) || 0];
        m.live = true;
        m.minute = (ev.status && ev.status.displayClock) || st.shortDetail || '';
        if (/HALFTIME/i.test(st.name || '')) m.minute = 'استراحة';
      } else if (st.state === 'post') {
        m.score = [Number(home.score) || 0, Number(away.score) || 0];
        if (/POSTPONED|CANCEL/i.test(st.name || '')) { delete m.score; m.note = 'مؤجلة'; }
      } else if (/POSTPONED|CANCEL/i.test(st.name || '')) {
        m.note = 'مؤجلة';
      }
      matches.push(m);
    });
    matches.sort(function(a, b){ return a._ts - b._ts; });
    matches.forEach(function(m){ delete m._ts; });
    if (matches.length) leagues.push({ name: lg.name, badge: lg.badge, matches: matches });
  });
  return leagues;
}

      { label: 'DAZN — عالمياً', url: 'https://www.dazn.com' },
      { label: 'SuperSport — جنوب أفريقيا', url: 'https://supersport.com' }
    ] }
];

var LEAGUES = [];
var DATA_SOURCE = "";
function loadManual(){
  return fetch("/matches-data.js", { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(code){
      var shared = new Function(code + "\n;return (typeof LEAGUES !== 'undefined') ? LEAGUES : null;")();
      if (shared) { LEAGUES = mergeExtra(shared, riyadhDate(new Date())); DATA_SOURCE = "manual"; }
    });
}
function loadData(then){
  var todayStr = riyadhDate(new Date());
  Promise.allSettled(MATCH_LEAGUES.map(function(lg){ return fetchLeagueDay(lg.code, todayStr); }))
    .then(function(results){
      var okCount = results.filter(function(r){ return r.status === 'fulfilled'; }).length;
      if (!okCount) throw new Error('all_failed');
      LEAGUES = mergeExtra(buildFromEspn(results, todayStr), todayStr);
      DATA_SOURCE = "auto";
    })
    .catch(function(){ return loadManual().catch(function(){}); })
    .then(then);
}
loadData(function(){ render(); tick(); });

function render(){
  var root = document.getElementById("leagues");
  root.innerHTML = "";
  var ok = LEAGUES.length && LEAGUES.some(function(l){ return l.matches.length; });
  if (!ok) {
    root.innerHTML = '<div class="empty">لا توجد مباريات اليوم — نلقاكم غداً ⚽</div>';
    return;
  }
  LEAGUES.forEach(function(league){
    if (!league.matches.length) return;
    var sec = document.createElement("section");
    sec.className = "league" + (league.featured ? " league--featured" : "");
    sec.innerHTML =
      '<div class="league-head"><span class="league-badge">' + (league.badge || "⚽") + "</span>" +
      "<span>" + league.name + "</span></div>" +
      league.matches.map(function(m){
        var done = Array.isArray(m.score);
        var live = isLiveNow(m);
        var timeCell = live
          ? '<div class="time live" dir="ltr">● ' + (m.minute || 'مباشر') + '</div>'
          : done
            ? '<div class="time ft">انتهت</div>'
            : m.note
              ? '<div class="time ft">' + m.note + '</div>'
              : '<div class="time">' + m.time + "</div>";
        var midCell = done
          ? '<div class="vs score" dir="ltr">' + m.score[1] + " - " + m.score[0] + "</div>"
          : '<div class="vs">VS</div>';
        var info = MATCH_INFO[m.home + '|' + m.away] || MATCH_INFO[m.away + '|' + m.home] || {};
        /* إدخال مؤرَّخ لا يخص اليوم يُتجاهل تلقائيًا */
        if (info.d && info.d !== riyadhDate(new Date())) info = {};
        var chan   = m.channel || info.ch || CHANNELS[league.name] || '';
        var caster = m.commentator || info.caster || '';
        var chanRow = '';
        if (chan || caster) {
          chanRow = '<div class="chan">' +
            (chan ? '<span class="chan__tv">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg>' +
              chan + '</span>' : '') +
            (caster ? '<span class="chan__mic">🎙 المعلق: ' + caster + '</span>' : '') +
            '</div>';
        }
        var watchBtn = '';
        if (m.watch) {
          var chans = Array.isArray(m.watch) ? m.watch : [m.watch];
          var started = live || done || (function(){
            var st = toMinutes(m.time); if (st == null) return false;
            var n = riyadhNow(); return (n.getHours()*60 + n.getMinutes()) >= st;
          })();
          watchBtn = '<div class="watch-wrap">' + chans.map(function(c, i){
            return '<a class="watch' + (i ? ' watch--alt' : '') + '" href="' + c.url +
                   '" target="_blank" rel="noopener">' + (i ? '' : '<i></i>') +
                   (c.label || 'بث مباشر') + '</a>';
          }).join('') + '</div>' +
          (started ? '' : '<div class="soon-note" data-starts="' + m.time + '">تبدأ المباراة الساعة ' + m.time + '</div>');
        }
        return '<div class="match">' + timeCell +
          '<div class="team">' + m.home + "</div>" + midCell +
          '<div class="team">' + m.away + "</div>" + chanRow + watchBtn + "</div>";
      }).join("");
    root.appendChild(sec);
  });
}

/* تحديث تلقائي: كل دقيقة أثناء مباراة جارية، وكل ٥ دقائق خلاف ذلك */
function tick(){
  var anyLive = LEAGUES.some(function(l){ return l.matches.some(function(m){ return m.live || isLiveNow(m); }); });
  setTimeout(function(){ loadData(function(){ render(); tick(); }); }, anyLive ? 60000 : 300000);
}

/* ===== حفظ / مشاركة الجدول كصورة ===== */
document.getElementById("shareBtn").addEventListener("click", function(){
  var btn = this;
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ جاري التجهيز…";
  function restore(){ btn.disabled = false; btn.textContent = old; }
  function failed(){ btn.disabled = false; btn.textContent = "تعذّر الحفظ — حاول مرة أخرى";
    setTimeout(function(){ btn.textContent = old; }, 2600); }

  function capture(){
    var frame = document.querySelector(".frame");
    /* حد المتصفحات (خاصة سفاري على الآيفون) ~١٦ مليون بكسل للوحة الواحدة.
       نحسب أعلى دقة ممكنة ضمن هذا الحد بدل تثبيت رقم يفشل مع الصفحات الطويلة. */
    var w = frame.scrollWidth, hgt = frame.scrollHeight;
    var MAX_PX = 15000000;
    var maxScale = Math.sqrt(MAX_PX / (w * hgt));
    var scale = Math.max(1.5, Math.min(4, maxScale, (window.devicePixelRatio || 1) * 2.5));

    html2canvas(frame, {
      backgroundColor: "#f7f4ec",
      scale: scale,
      useCORS: true,
      allowTaint: false,
      imageTimeout: 15000,
      windowWidth: w,
      windowHeight: hgt,
      ignoreElements: function(el){ return el.classList && el.classList.contains("topbar"); }
    }).then(function(canvas){
      canvas.toBlob(function(blob){
        if (!blob) { failed(); return; }
        var file = new File([blob], "lipro-matches.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "مباريات اليوم — أكاديمية ليبرو الرياضية" })
            .catch(function(){})
            .then(restore);
        } else {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "lipro-matches.png";
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
          restore();
        }
      }, "image/png");
    }).catch(failed);
  }

  if (window.html2canvas) { capture(); }
  else {
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = capture;
    s.onerror = failed;
    document.head.appendChild(s);
  }
});
</script>
