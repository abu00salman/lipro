<style>
  :root{
    --green-900:#123f35;
    --green-700:#1b5e4b;
    --green-600:#20705a;
    --gold-500:#c39a2f;
    --gold-400:#d4ad45;
    --cream:#f7f4ec;
    --ink:#173d33;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Cairo',sans-serif;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(180deg, var(--green-900) 0%, var(--green-700) 45%, #2a7a5e 100%);
    min-height:100vh;
    color:var(--ink);
    padding:0 0 48px;
  }

  .frame{
    max-width:520px;
    margin:0 auto;
    background:
      linear-gradient(180deg, #fdfcf8 0%, var(--cream) 100%);
    border-radius:0 0 28px 28px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }

  /* الشريط العلوي المائل */
  .ribbon{
    height:14px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400) 40%, var(--green-700) 40%, var(--green-900));
  }

  .topbar{padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    color:var(--green-700);
    font-weight:800;
    font-size:14px;
    text-decoration:none;
    border:1px solid rgba(27,94,75,.25);
    border-radius:999px;
    padding:6px 16px;
    box-shadow:0 2px 6px rgba(18,63,53,.08);
  }
  .share-group{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .share-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:linear-gradient(90deg,var(--gold-500),var(--gold-400));
    color:#fff;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:7px 16px;
    box-shadow:0 2px 6px rgba(18,63,53,.15);
  }
  .share-btn:disabled{opacity:.65;cursor:wait}
  .share-toast{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    max-width:220px;
    background:var(--green-900);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    line-height:1.5;
    padding:8px 12px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:5;
  }
  .share-toast.show{opacity:1;transform:none}
  .time.live{
    background:#e8453f;
    animation:lp-pulse 1.4s ease-in-out infinite;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    padding:3px 0;
  }
  .time.live .time-clock{font-size:10.5px;font-weight:700;opacity:.9}
  .time.live .time-live-tag{font-size:12px;font-weight:900}
  @keyframes lp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
  header{
    text-align:center;
    padding:28px 24px 8px;
  }
  header img.logo{
    height:110px;
    display:block;
    margin:0 auto 10px;
  }
  .logo-fallback{
    font-weight:900;
    font-size:44px;
    letter-spacing:2px;
    color:var(--green-700);
    line-height:1;
  }
  .logo-fallback small{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--gold-500);
    letter-spacing:6px;
    margin-top:4px;
  }
  .academy-name{
    color:var(--gold-500);
    font-weight:800;
    font-size:20px;
    margin-top:6px;
  }
  .academy-name span{
    display:block;
    color:var(--green-700);
    font-size:12px;
    font-weight:700;
    letter-spacing:4px;
  }

  h1{
    font-size:52px;
    font-weight:900;
    color:var(--green-700);
    text-shadow:0 2px 0 rgba(195,154,47,.35);
    line-height:1.1;
    margin-top:4px;
  }
  .date-pill{
    display:inline-block;
    background:var(--green-700);
    color:#fff;
    font-weight:800;
    font-size:18px;
    padding:6px 26px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:0 3px 0 var(--gold-500);
  }

  main{padding:22px 16px 8px}

  .league{
    background:#fff;
    border:1px solid rgba(27,94,75,.12);
    border-radius:18px;
    margin-bottom:16px;
    padding:10px 10px 6px;
    box-shadow:0 6px 18px rgba(18,63,53,.08);
  }
  .league-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400));
    color:#fff;
    font-weight:900;
    font-size:18px;
    border-radius:12px;
    padding:7px 14px;
    margin-bottom:8px;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .league-head-content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .league-toggle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    background:rgba(255,255,255,.25);
    border:none;
    border-radius:6px;
    color:#fff;
    font-weight:900;
    cursor:pointer;
    font-size:14px;
    transition:background .2s ease;
  }
  .league-toggle:hover{background:rgba(255,255,255,.4)}
  .league.collapsed .match{display:none}
  /* ===== بطولة مميزة (كأس الخليج) — أخضر وطني بإطار ذهبي ===== */
  .league--featured{
    border:2px solid var(--gold-500);
    background:linear-gradient(180deg,#fffdf6,#fff);
    box-shadow:0 14px 34px -12px rgba(195,154,47,.45);
    position:relative;
  }
  .league--featured::before{
    content:"البطولة الأبرز";
    position:absolute;top:-12px;inset-inline-start:18px;
    background:var(--gold-500);color:#fff;font-weight:900;font-size:11.5px;
    border-radius:999px;padding:3px 12px;letter-spacing:normal;
    box-shadow:0 4px 12px rgba(195,154,47,.4);
  }
  .league--featured .league-head{
    background:linear-gradient(100deg,#04452A,#046A38 55%,#035F32);
    font-size:19px;padding:10px 14px;
  }
  .league--featured .league-badge{background:var(--gold-500);color:#fff;font-size:17px}
  .league--featured .match{border-color:rgba(195,154,47,.35)}

  .league-badge.is-text{
    font-size:11px;font-weight:900;letter-spacing:.04em;padding:0 6px;
    min-width:38px;height:28px;border-radius:8px;font-family:'Cairo',sans-serif;
  }
  .league-badge{
    background:#fff;
    color:var(--gold-500);
    font-weight:900;
    font-size:12px;
    min-width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    flex:none;
  }

  .match{
    display:grid;
    grid-template-columns:96px 1fr 64px 1fr;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid rgba(27,94,75,.1);
    border-radius:12px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .time{
    background:var(--gold-500);
    color:#fff;
    font-weight:800;
    font-size:15px;
    text-align:center;
    border-radius:9px;
    padding:4px 0;
    direction:ltr;
  }
  .team{
    font-weight:800;
    font-size:17px;
    text-align:center;
    color:var(--ink);
  }
  .vs{
    background:var(--green-700);
    color:var(--gold-400);
    font-weight:900;
    font-size:14px;
    text-align:center;
    border-radius:8px;
    padding:5px 0;
    clip-path:polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%);
  }
  .time.ft{background:var(--green-700)}
  .watch{
    grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:10px;padding:10px 16px;border-radius:10px;text-decoration:none;
    background:linear-gradient(135deg,#D64545,#B93030);color:#fff;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;
    box-shadow:0 8px 18px -10px rgba(214,69,69,.8);
  }
  .watch:hover{filter:brightness(1.08)}
  .watch i{width:8px;height:8px;border-radius:50%;background:#fff;animation:lp-pulse 1.4s ease-in-out infinite}
  .chan{
    grid-column:1 / -1;display:flex;align-items:center;justify-content:center;
    gap:7px;flex-wrap:wrap;margin-top:9px;
    font-family:'Cairo',sans-serif;font-size:12.5px;color:var(--green-700);
  }
  .chan__tv{
    display:inline-flex;align-items:center;gap:6px;font-weight:800;
    background:rgba(14,74,60,.08);border:1px solid rgba(14,74,60,.18);
    border-radius:999px;padding:4px 11px;
  }
  .chan__tv svg{flex-shrink:0;opacity:.85}
  .chan__mic{display:inline-flex;align-items:center;gap:5px;opacity:.9;font-weight:600}
  .chan-list{
    grid-column:1 / -1;display:flex;flex-direction:column;gap:5px;margin-top:9px;
    font-family:'Cairo',sans-serif;font-size:12px;color:var(--green-700);
  }
  .chan-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(14,74,60,.06);border:1px solid rgba(14,74,60,.14);
    border-radius:8px;padding:4px 10px;
  }
  .chan-row__tv{display:inline-flex;align-items:center;gap:6px;font-weight:800;flex-shrink:0}
  .chan-row__tv svg{flex-shrink:0;opacity:.85}
  .chan-row__mic{display:inline-flex;align-items:center;gap:5px;opacity:.9;font-weight:600;font-size:11.5px;text-align:left}
  .chan-block{grid-column:1 / -1;margin-top:9px}
  .chan-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:rgba(14,74,60,.08);border:1px solid rgba(14,74,60,.18);
    border-radius:10px;padding:8px 12px;cursor:pointer;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:12.5px;color:var(--green-700);
  }
  .chan-toggle__icon{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:20px;height:20px;border-radius:5px;background:rgba(14,74,60,.15);font-weight:900;
  }
  .chan-block .chan-list{margin-top:6px}
  .chan-block.collapsed .chan-list{display:none}
  .watch--alt{background:var(--green-700);box-shadow:none;font-size:13px;padding:8px 14px}
  .watch-wrap{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .watch-wrap .watch{margin-top:0;flex:1 1 auto}
  .soon-note{grid-column:1 / -1;text-align:center;margin-top:8px;font-size:12.5px;color:var(--green-700);font-weight:700}
  .vs.score{font-size:15px;letter-spacing:1px}

  /* ===== أزرار مقاطع الأهداف ===== */
  .goals-wrap{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .goal-btn{
    display:inline-flex;align-items:center;gap:7px;
    background:linear-gradient(135deg,var(--green-700),var(--green-900));
    color:#fff;border:1px solid rgba(245,197,88,.35);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;
    border-radius:999px;padding:9px 16px;cursor:pointer;
    box-shadow:0 6px 16px -8px rgba(18,63,53,.5);
    transition:transform .15s ease;
  }
  .goal-btn:active{transform:scale(.96)}
  .goal-btn__icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;background:var(--gold-500);
    color:var(--green-900);font-size:9px;flex:none;
  }

  /* ===== نافذة تشغيل الفيديو ===== */
  .video-lightbox{
    position:fixed;inset:0;z-index:200;
    background:rgba(5,20,17,.92);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .video-lightbox.open{opacity:1;pointer-events:auto}
  .video-lightbox__box{
    position:relative;width:100%;max-width:420px;
    border-radius:18px;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
    background:#000;
  }
  .video-lightbox video{width:100%;max-height:82vh;display:block}
  .video-lightbox__close{
    position:absolute;top:-14px;inset-inline-end:-14px;
    width:36px;height:36px;border-radius:50%;
    background:var(--gold-500);color:var(--green-900);border:none;
    font-size:17px;font-weight:900;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    z-index:1;
  }

  /* ===== زر البث المباشر ===== */
  .stream-row{grid-column:1 / -1;display:flex;justify-content:center;margin-top:10px}
  .stream-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#e21c1c,#8a0d0d);
    color:#fff;border:1px solid rgba(255,255,255,.3);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;
    border-radius:999px;padding:9px 18px;cursor:pointer;
    box-shadow:0 6px 18px -6px rgba(180,20,20,.65);
  }
  .stream-btn__dot{
    width:9px;height:9px;border-radius:50%;background:#fff;flex:none;
    animation:streamPulse 1.4s ease-in-out infinite;
  }
  @keyframes streamPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

  /* ===== تمويه المحتوى عند فتح البث ===== */
  .frame{transition:filter .45s ease}
  .frame.blurred{filter:blur(16px) brightness(.65) saturate(.8);pointer-events:none;user-select:none}

  /* ===== لوحة البث السفلية (تفتح بأسلوب مجلدات iOS 6) ===== */
  .live-sheet{
    position:fixed;z-index:300;background:#05140f;overflow:hidden;display:none;
    box-shadow:0 -24px 70px rgba(0,0,0,.55);
    transition:left .5s cubic-bezier(.32,1.65,.5,1), top .5s cubic-bezier(.32,1.65,.5,1),
               width .5s cubic-bezier(.32,1.65,.5,1), height .5s cubic-bezier(.32,1.65,.5,1),
               border-radius .42s ease;
  }
  .live-sheet.show{display:block}
  .live-sheet__grip{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.35);z-index:2;
  }
  .live-sheet__head{
    position:absolute;top:0;left:0;right:0;height:42px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);
    opacity:0;transition:opacity .3s ease;
  }
  .live-sheet.open .live-sheet__head{opacity:1}
  .live-sheet__title{color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .live-sheet__close{
    width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);
    border:none;color:#fff;font-size:14px;font-weight:900;cursor:pointer;flex:none;
  }
  .live-sheet__body{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
  .live-sheet.open .live-sheet__body{opacity:1}
  .live-sheet iframe{width:100%;height:100%;border:0;display:block}

  /* ===== زر الاحتفال بالفوز ===== */
  .team--celebrate{cursor:pointer;position:relative;transition:transform .15s ease;user-select:none}
  .team--celebrate:active{transform:scale(.93)}
  .celebrate-badge{display:inline-block;animation:celebrateBounce 1.6s ease-in-out infinite}
  @keyframes celebrateBounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-10deg)}}

  /* ===== نافذة الاحتفال بالفوز ===== */
  .celebrate-overlay{
    position:fixed;inset:0;z-index:400;
    background:radial-gradient(circle at 50% 18%, #0e4a3c 0%, #06261e 55%, #04140f 100%);
    display:none;align-items:center;justify-content:center;
    opacity:0;transition:opacity .35s ease;overflow:hidden;padding:20px;
  }
  .celebrate-overlay.show{display:flex}
  .celebrate-overlay.open{opacity:1}
  #fireworksCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .celebrate-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti-piece{position:absolute;top:-24px;width:9px;height:14px;opacity:.9;animation:confettiFall linear forwards}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(112vh) rotate(540deg);opacity:.2}
  }
  .celebrate-close{
    position:absolute;top:16px;inset-inline-end:16px;z-index:5;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  }
  .celebrate-card{
    position:relative;z-index:3;width:100%;max-width:420px;
    background:rgba(8,38,30,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(245,197,88,.35);border-radius:26px;
    padding:30px 22px 24px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:scale(.8);opacity:0;
    transition:transform .5s cubic-bezier(.32,1.65,.5,1), opacity .4s ease;
  }
  .celebrate-overlay.open .celebrate-card{transform:scale(1);opacity:1}
  .celebrate-trophy{font-size:62px;animation:trophyPop .9s cubic-bezier(.32,1.8,.5,1), trophySway 2.4s ease-in-out 1s infinite}
  @keyframes trophyPop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes trophySway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .celebrate-flag{font-size:26px;margin-top:-6px}
  .celebrate-title{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;margin:8px 0 2px;
    background:linear-gradient(90deg,#f5c558,#fff,#f5c558);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shine 2.5s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  .celebrate-sub{color:#dff0e8;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;margin:0 0 16px}
  .celebrate-wall{display:flex;flex-direction:column;gap:6px;max-height:120px;overflow:hidden;margin-bottom:14px}
  .celebrate-wall:empty{display:none;margin-bottom:0}
  .wall-chip{
    background:rgba(245,197,88,.14);border:1px solid rgba(245,197,88,.3);
    color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:12.5px;
    border-radius:999px;padding:7px 14px;animation:chipIn .4s cubic-bezier(.32,1.6,.5,1);
  }

<script>
document.getElementById("today-date").textContent =
  new Date().toLocaleDateString("ar-SA-u-ca-gregory", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
  });

/* الوقت الحالي بتوقيت الرياض — لكشف المباريات الجارية الآن */
function riyadhNow(){
  try { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Riyadh" })); }
  catch (e) { return new Date(); }
}

/* "09:00 PM" → دقائق من بداية اليوم */
function toMinutes(t){
  var m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(String(t || ""));
  if (!m) return null;
  var h = Number(m[1]) % 12;
  if (/pm/i.test(m[3])) h += 12;
  return h * 60 + Number(m[2]);
}

/* مباراة بلا نتيجة وبين انطلاقها ونهايتها التقريبية = جارية الآن.
   ومباراة معها score و live:true = نتيجة مباشرة أثناء اللعب. */
var LIVE_WINDOW_MIN = 115;
function isLiveNow(m){
  if (Array.isArray(m.score)) return m.live === true;
  var start = toMinutes(m.time);
  if (start == null) return false;
  var now = riyadhNow();
  var diff = (now.getHours() * 60 + now.getMinutes()) - start;
  return diff >= 0 && diff <= LIVE_WINDOW_MIN;
}

const TEAM_STOP = new Set(['al','fc','sc','cf','ac','as','ss','us','ssc','afc','rc','rcd','ud','sd','club','saudi','de','the',
  'fk','sk','bk','if','ol','og','sv','vfl','vfb','tsg','fsv','bsc','sco','stade','calcio','1899','1904','1909','1910','1913','1846','1893','1900']);
function teamKey(name) {
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((w) => w && !TEAM_STOP.has(w)).join(' ').trim();
}
function arTeam(name, short) {
  const k = teamKey(name);
  if (TEAM_AR[k]) return TEAM_AR[k];
  const words = k.split(' ');
  for (let n = words.length; n >= 1; n--) { const sub = words.slice(0, n).join(' '); if (TEAM_AR[sub]) return TEAM_AR[sub]; }
  return short || name;
}
function riyadhDate(d){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
function riyadhTime12(d){
  return new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', hour12: true }).format(d).toUpperCase();
}
function fetchLeagueDay(code, ymd){
  var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + code + '/scoreboard?dates=' + ymd.replace(/-/g, '') + '&limit=100';
  return fetch(url, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('espn_' + r.status); return r.json(); });
}
/* يدمج المباريات المضافة يدويًا لليوم الحالي مع مباريات المصدر التلقائي */
function mergeExtra(leagues, todayStr, liveMap){
  leagues = leagues || [];
  liveMap = liveMap || {};
  EXTRA_MATCHES.filter(function(m){ return m.date === todayStr; }).forEach(function(m){
    var same = leagues.filter(function(l){ return l.name === m.league; })[0];
    var entry = { time: m.time, home: m.home, away: m.away };
    if (m.watch) entry.watch = m.watch;
    if (m.channel) entry.channel = m.channel;
    if (m.commentator) entry.commentator = m.commentator;
    if (m.channels) entry.channels = m.channels;
    if (m.goals) entry.goals = m.goals;
    if (m.stream) entry.stream = m.stream;
    if (m.celebrate) entry.celebrate = true;
    if (m.score) { entry.score = m.score; if (m.live) entry.live = true; }
    else {
      /* نتيجة تلقائية (مباشرة أو نهائية) من المصدر إن وُجدت نفس المباراة */
      var auto = liveMap[m.home + '|' + m.away], flip = false;
      if (!auto) { auto = liveMap[m.away + '|' + m.home]; flip = !!auto; }
      if (auto && auto.score) {
        entry.score = flip ? [auto.score[1], auto.score[0]] : auto.score.slice();
        if (auto.live) { entry.live = true; entry.minute = auto.minute; }
      } else if (auto && auto.note) entry.note = auto.note;
    }
    if (m.note) entry.note = m.note;
    if (same) {
      var dup = same.matches.some(function(x){ return x.home === entry.home && x.away === entry.away; });
      if (!dup) same.matches.push(entry);
    } else {
      leagues.unshift({ name: m.league, badge: m.badge || '⚽', featured: !!m.featured, matches: [entry] });
    }
  });
  /* البطولات المميزة (مثل كأس الخليج) دائمًا في أعلى القائمة */
  leagues.sort(function(a, b){ return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });
  return leagues;
}

function buildFromEspn(results, todayStr){
  var leagues = [];
  MATCH_LEAGUES.forEach(function(lg, i){
    var res = results[i];
    if (!res || res.status !== 'fulfilled' || !res.value || !Array.isArray(res.value.events)) return;
    var matches = [];
    res.value.events.forEach(function(ev){
      var m = espnEventToMatch(ev, todayStr);
      if (m) matches.push(m);
    });
    matches.sort(function(a, b){ return a._ts - b._ts; });
    matches.forEach(function(m){ delete m._ts; });
    if (matches.length) leagues.push({ name: lg.name, badge: lg.badge, matches: matches });
  });
  return leagues;
}

var EXTRA_SCORE_LEAGUES = ['uefa.nations', 'caf.nations_qual', 'global.gulf_cup'];
function buildLiveMap(results, todayStr){
  var map = {};
  results.forEach(function(res){
    if (!res || res.status !== 'fulfilled' || !res.value || !Array.isArray(res.value.events)) return;
    res.value.events.forEach(function(ev){
      var m = espnEventToMatch(ev, todayStr);
      if (m) map[m.home + '|' + m.away] = m;
    });
  });
  return map;
}

function espnEventToMatch(ev, todayStr){
      var when = new Date(ev.date);
      if (isNaN(when.getTime()) || riyadhDate(when) !== todayStr) return null;
      var comp = (ev.competitions && ev.competitions[0]) || {};
      var comps = comp.competitors || [];
      var home = comps.filter(function(c){ return c.homeAway === 'home'; })[0] || comps[0];
      var away = comps.filter(function(c){ return c.homeAway === 'away'; })[0] || comps[1];
      if (!home || !away) return null;
      var st = (ev.status && ev.status.type) || {};
      var m = {
        time: riyadhTime12(when),
        home: arTeam(home.team && home.team.displayName, home.team && home.team.shortDisplayName),
        away: arTeam(away.team && away.team.displayName, away.team && away.team.shortDisplayName),
        _ts: when.getTime()
      };
      if (st.state === 'in') {
        m.score = [Number(home.score) || 0, Number(away.score) || 0];
        m.live = true;
        m.minute = (ev.status && ev.status.displayClock) || st.shortDetail || '';
        if (/HALFTIME/i.test(st.name || '')) m.minute = 'استراحة';
      } else if (st.state === 'post') {
        m.score = [Number(home.score) || 0, Number(away.score) || 0];
        if (/POSTPONED|CANCEL/i.test(st.name || '')) { delete m.score; m.note = 'مؤجلة'; }
      } else if (/POSTPONED|CANCEL/i.test(st.name || '')) {
        m.note = 'مؤجلة';
      }
      return m;
}

function loadData(then){
  var todayStr = riyadhDate(new Date());
  var codes = MATCH_LEAGUES.map(function(lg){ return lg.code; }).concat(EXTRA_SCORE_LEAGUES);
  Promise.allSettled(codes.map(function(code){ return fetchLeagueDay(code, todayStr); }))
    .then(function(results){
      var main = results.slice(0, MATCH_LEAGUES.length);
      var okCount = main.filter(function(r){ return r.status === 'fulfilled'; }).length;
      if (!okCount) throw new Error('all_failed');
      LEAGUES = mergeExtra(buildFromEspn(main, todayStr), todayStr, buildLiveMap(results, todayStr));
      DATA_SOURCE = "auto";
    })
    .catch(function(){ return loadManual().catch(function(){}); })
    .then(then);
}
loadData(function(){ render(); tick(); });

function render(){
  var root = document.getElementById("leagues");
  root.innerHTML = "";
  var ok = LEAGUES.length && LEAGUES.some(function(l){ return l.matches.length; });
  if (!ok) {
    root.innerHTML = '<div class="empty">لا توجد مباريات اليوم — نلقاكم غداً ⚽</div>';
    return;
  }
  LEAGUES.forEach(function(league, leagueIdx){
    if (!league.matches.length) return;
    var sec = document.createElement("section");
    var isCollapsed = collapsedLeagues[leagueIdx] === true;
    sec.className = "league" + (league.featured ? " league--featured" : "") + (isCollapsed ? " collapsed" : "");
    sec.dataset.leagueIdx = leagueIdx;
    sec.innerHTML =
      '<div class="league-head"><div class="league-head-content"><span class="league-badge' + (/^[A-Za-z0-9]{2,5}$/.test(league.badge || '') ? ' is-text' : '') + '">' + (league.badge || "⚽") + "</span>" +
      "<span>" + league.name + "</span></div><button class=\"league-toggle\" type=\"button\" aria-label=\"" + (isCollapsed ? "إظهار" : "إخفاء") + "\">" + (isCollapsed ? "+" : "−") + "</button></div>" +
      league.matches.map(function(m){
        var done = Array.isArray(m.score);
        var live = isLiveNow(m);
        var timeCell = live
          ? '<div class="time live" dir="ltr"><span class="time-clock">' + m.time + '</span><span class="time-live-tag">● ' + (m.minute || 'مباشر') + '</span></div>'
          : done
            ? '<div class="time ft">انتهت</div>'
            : m.note
              ? '<div class="time ft">' + m.note + '</div>'
              : '<div class="time">' + m.time + "</div>";
        var midCell = done
          ? '<div class="vs score" dir="ltr">' + m.score[1] + " - " + m.score[0] + "</div>"
          : '<div class="vs">VS</div>';
        var info = MATCH_INFO[m.home + '|' + m.away] || MATCH_INFO[m.away + '|' + m.home] || {};
        /* إدخال مؤرَّخ لا يخص اليوم يُتجاهل تلقائيًا */
        if (info.d && info.d !== riyadhDate(new Date())) info = {};
        var chanRow = '';
        if (Array.isArray(m.channels) && m.channels.length) {
          /* قائمة قنوات متعددة، كل قناة مع معلّقها — مع زر تصغير/تكبير */
          var chanKey = m.home + '|' + m.away;
          var chanCollapsed = collapsedChannels[chanKey] === true;
          chanRow = '<div class="chan-block' + (chanCollapsed ? ' collapsed' : '') + '" data-chan-key="' + chanKey.replace(/"/g, '&quot;') + '">' +
            '<button class="chan-toggle" type="button" aria-label="' + (chanCollapsed ? 'إظهار' : 'إخفاء') + ' القنوات">' +
              '<span>📺 القنوات والمعلقون (' + m.channels.length + ')</span>' +
              '<span class="chan-toggle__icon">' + (chanCollapsed ? '+' : '−') + '</span>' +
            '</button>' +
            '<div class="chan-list">' + m.channels.map(function(c){
              return '<div class="chan-row">' +
                '<span class="chan-row__tv">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg>' +
                c.name + '</span>' +
                (c.caster ? '<span class="chan-row__mic">🎙 ' + c.caster + '</span>' : '') +
                '</div>';
            }).join('') + '</div>' +
          '</div>';
        } else {
          var chan   = m.channel || info.ch || CHANNELS[league.name] || '';
          var caster = m.commentator || info.caster || '';
          if (chan || caster) {
            chanRow = '<div class="chan">' +
              (chan ? '<span class="chan__tv">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg>' +
                chan + '</span>' : '') +
              (caster ? '<span class="chan__mic">🎙 المعلق: ' + caster + '</span>' : '') +
              '</div>';
          }
        }
        var streamRow = '';
        if (m.stream) {
          streamRow = '<div class="stream-row"><button class="stream-btn" type="button" data-stream-url="' + m.stream.url + '">' +
            '<span class="stream-btn__dot"></span>' + (m.stream.label || '🔴 بث مباشر الآن') +
            '</button></div>';
        }
        var goalsRow = '';
        if (Array.isArray(m.goals) && m.goals.length) {
          goalsRow = '<div class="goals-wrap">' + m.goals.map(function(g){
            return '<button class="goal-btn" type="button" data-video="' + g.video + '" data-poster="' + (g.poster || '') + '">' +
              '<span class="goal-btn__icon">▶</span>' + g.label +
              '</button>';
          }).join('') + '</div>';
        }
        var watchBtn = '';
        if (m.watch) {
          var chans = Array.isArray(m.watch) ? m.watch : [m.watch];
          var started = live || done || (function(){
            var st = toMinutes(m.time); if (st == null) return false;
            var n = riyadhNow(); return (n.getHours()*60 + n.getMinutes()) >= st;
          })();
          watchBtn = '<div class="watch-wrap">' + chans.map(function(c, i){
            return '<a class="watch' + (i ? ' watch--alt' : '') + '" href="' + c.url +
                   '" target="_blank" rel="noopener">' + (i ? '' : '<i></i>') +
                   (c.label || 'بث مباشر') + '</a>';
          }).join('') + '</div>' +
          (started ? '' : '<div class="soon-note" data-starts="' + m.time + '">تبدأ المباراة الساعة ' + m.time + '</div>');
        }
        var homeTeamHtml = m.celebrate
          ? '<div class="team team--celebrate" data-celebrate="1" role="button" tabindex="0">' + m.home + ' <span class="celebrate-badge">🏆</span></div>'
          : '<div class="team">' + m.home + '</div>';
        return '<div class="match">' + timeCell +
          homeTeamHtml + midCell +
          '<div class="team">' + m.away + "</div>" + chanRow + streamRow + goalsRow + watchBtn + "</div>";
      }).join("");
    root.appendChild(sec);
  });
  /* ربط أزرار الإخفاء/الإظهار */
  document.querySelectorAll(".league-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){
      var league = btn.closest(".league");
      if (league) {
        var leagueIdx = league.dataset.leagueIdx;
        league.classList.toggle("collapsed");
        btn.textContent = league.classList.contains("collapsed") ? "+" : "−";
        btn.setAttribute("aria-label", league.classList.contains("collapsed") ? "إظهار" : "إخفاء");
        collapsedLeagues[leagueIdx] = league.classList.contains("collapsed");
      }
    });
  });
  /* ربط زر تصغير/تكبير قائمة القنوات والمعلقين */
  document.querySelectorAll(".chan-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){
      var block = btn.closest(".chan-block");
      if (block) {
        var chanKey = block.dataset.chanKey;
        block.classList.toggle("collapsed");
        var collapsed = block.classList.contains("collapsed");
        btn.querySelector(".chan-toggle__icon").textContent = collapsed ? "+" : "−";
        btn.setAttribute("aria-label", collapsed ? "إظهار القنوات" : "إخفاء القنوات");
        collapsedChannels[chanKey] = collapsed;
      }
    });
  });
}

/* تحديث تلقائي: كل دقيقة أثناء مباراة جارية، وكل ٥ دقائق خلاف ذلك */
function tick(){
  var anyLive = LEAGUES.some(function(l){ return l.matches.some(function(m){ return m.live || isLiveNow(m); }); });
  setTimeout(function(){ loadData(function(){ render(); tick(); }); }, anyLive ? 60000 : 300000);
}

/* ===== حفظ / مشاركة الجدول كصورة ===== */
(function(){
  var shareBtn = document.getElementById("shareBtn");
  var toastEl = document.getElementById("shareToast");
  var toastTimer = null;

  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 5000);
  }

  function ensureHtml2Canvas(then, fail){
    if (window.html2canvas) { then(); return; }
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = then;
    s.onerror = fail;
    document.head.appendChild(s);
  }

  /* يصوّر البطاقة كاملة ويرجع Blob بصيغة PNG */
  function captureBlob(){
    return new Promise(function(resolve, reject){
      ensureHtml2Canvas(function(){
        var frame = document.querySelector(".frame");
        var saved = [];
        var hiddenLeagues = [];
        frame.querySelectorAll("*").forEach(function(el){
          var computed = window.getComputedStyle(el);
          if (computed.letterSpacing && computed.letterSpacing !== "normal" && computed.letterSpacing !== "0px") {
            saved.push({el: el, ls: el.style.letterSpacing || ""});
            el.style.letterSpacing = "normal";
          }
        });
        /* إخفاء الدوريات المخفية مؤقتاً للحفظ */
        frame.querySelectorAll(".league.collapsed").forEach(function(league){
          hiddenLeagues.push({el: league, display: league.style.display || ""});
          league.style.display = "none";
        });

        /* حد المتصفحات (خاصة سفاري على الآيفون) ~١٦ مليون بكسل للوحة الواحدة.
           نحسب أعلى دقة ممكنة ضمن هذا الحد بدل تثبيت رقم يفشل مع الصفحات الطويلة. */
        var w = frame.scrollWidth, hgt = frame.scrollHeight;
        var MAX_PX = 15000000;
        var maxScale = Math.sqrt(MAX_PX / (w * hgt));
        var scale = Math.max(1.5, Math.min(4, maxScale, (window.devicePixelRatio || 1) * 2.5));

        html2canvas(frame, {
          backgroundColor: "#f7f4ec",
          scale: scale,
          useCORS: true,
          allowTaint: false,
          imageTimeout: 15000,
          windowWidth: w,
          windowHeight: hgt,
          ignoreElements: function(el){ return el.classList && el.classList.contains("topbar"); }
        }).then(function(canvas){
          saved.forEach(function(obj){ obj.el.style.letterSpacing = obj.ls; });
          hiddenLeagues.forEach(function(obj){ obj.el.style.display = obj.display; });
          canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("toBlob_failed")); }, "image/png");
        }).catch(function(err){
          saved.forEach(function(obj){ obj.el.style.letterSpacing = obj.ls; });
          hiddenLeagues.forEach(function(obj){ obj.el.style.display = obj.display; });
          reject(err);
        });
      }, function(){ reject(new Error("html2canvas_load_failed")); });
    });
  }

  var CAPTION = "⚽ مباريات اليوم — أكاديمية ليبرو الرياضية\nhttps://liproacademy.com/matches/";

  shareBtn.addEventListener("click", function(){
    var old = shareBtn.textContent;
    shareBtn.disabled = true;
    shareBtn.textContent = "⏳ جاري التجهيز…";
    function restore(){ shareBtn.disabled = false; shareBtn.textContent = old; }
    function failed(){
      restore();
      toast("تعذّر الحفظ — حاول مرة أخرى", 3200);
    }

    captureBlob().then(function(blob){
      var file = new File([blob], "lipro-matches.png", { type: "image/png" });
      var shareData = { files: [file], title: "مباريات اليوم — أكاديمية ليبرو الرياضية", text: CAPTION };

      if (navigator.canShare && navigator.canShare(shareData)) {
        navigator.share(shareData).catch(function(){}).then(restore);
        return;
      }

      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "lipro-matches.png";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      restore();
    }).catch(function(){ failed(); });
  });
})();

/* ===== تشغيل مقاطع الأهداف داخل الصفحة ===== */
(function(){
  var lightbox = document.getElementById("videoLightbox");
  var videoEl = document.getElementById("lightboxVideo");
  var closeBtn = document.getElementById("videoLightboxClose");

  function openVideo(src, poster){
    videoEl.poster = poster || "";
    videoEl.src = src;
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
    videoEl.play().catch(function(){});
  }

  function closeVideo(){
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.load();
  }

  /* تفويض الأحداث — الأزرار تُعاد بناؤها مع كل render() */
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".goal-btn");
    if (btn) { openVideo(btn.dataset.video, btn.dataset.poster); return; }
    if (e.target === lightbox) closeVideo();
  });
  closeBtn.addEventListener("click", closeVideo);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && lightbox.classList.contains("open")) closeVideo();
  });
})();

/* ===== البث المباشر — لوحة تتذيل في الصفحة بأسلوب مجلدات iOS 6 ===== */
(function(){
  var frameEl = document.querySelector(".frame");
  var sheet = document.getElementById("liveSheet");
  var frameIf = document.getElementById("liveSheetFrame");
  var closeBtn = document.getElementById("liveSheetClose");
  var originRect = null;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function finalRect(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var margin = 14, headH = 42;
    var w = Math.min(vw, 480) - margin * 2;
    var videoH = Math.round(w * 9 / 16);
    var h = headH + videoH;
    var maxH = vh - 110;
    if (h > maxH) {
      h = maxH;
      videoH = h - headH;
      w = Math.round(videoH * 16 / 9);
      if (w > vw - margin * 2) w = vw - margin * 2;
    }
    return { left: Math.round((vw - w) / 2), top: vh - h - margin, width: w, height: h };
  }

  function applyRect(r, radius){
    sheet.style.left = r.left + "px";
    sheet.style.top = r.top + "px";
    sheet.style.width = r.width + "px";
    sheet.style.height = r.height + "px";
    sheet.style.borderRadius = radius;
  }

  function openStream(btn){
    var url = btn.dataset.streamUrl;
    if (!url || sheet.classList.contains("show")) return;
    var r = btn.getBoundingClientRect();
    originRect = r;

    if (reduceMotion) {
      var fr = finalRect();
      applyRect(fr, "20px");
      sheet.classList.add("show");
      requestAnimationFrame(function(){ sheet.classList.add("open"); });
    } else {
      sheet.style.transition = "none";
      applyRect(r, "999px");
      sheet.classList.add("show");
      sheet.getBoundingClientRect(); /* إعادة تدفق لتثبيت الحالة الابتدائية */
      requestAnimationFrame(function(){
        sheet.style.transition = "";
        applyRect(finalRect(), "20px");
        sheet.classList.add("open");
      });
    }

    frameEl.classList.add("blurred");
    document.body.style.overflow = "hidden";
    frameIf.src = url;
  }

  function closeStream(){
    if (!sheet.classList.contains("show")) return;
    sheet.classList.remove("open");
    frameEl.classList.remove("blurred");
    document.body.style.overflow = "";

    if (reduceMotion) {
      sheet.classList.remove("show");
      frameIf.src = "";
      return;
    }

    var r = originRect || finalRect();
    applyRect(r, "999px");
    setTimeout(function(){
      sheet.classList.remove("show");
      frameIf.src = "";
    }, 460);
  }

  document.addEventListener("click", function(e){
    var btn = e.target.closest(".stream-btn");
    if (btn) { openStream(btn); return; }
  });
  closeBtn.addEventListener("click", closeStream);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && sheet.classList.contains("show")) closeStream();
  });
  window.addEventListener("resize", function(){
    if (sheet.classList.contains("open")) applyRect(finalRect(), "20px");
  });
})();

/* ===== احتفال الفوز — ألعاب نارية + تهاني الزوار ===== */
(function(){
  var overlay = document.getElementById("celebrateOverlay");
  if (!overlay) return;
  var frameEl = document.querySelector(".frame");
  var canvas = document.getElementById("fireworksCanvas");
  var ctx = canvas.getContext("2d");
  var confettiWrap = document.getElementById("celebrateConfetti");
  var closeBtn = document.getElementById("celebrateClose");
  var wall = document.getElementById("celebrateWall");
  var form = document.getElementById("celebrateForm");
  var input = document.getElementById("celebrateInput");
  var shareBtn = document.getElementById("celebrateShare");
  var card = document.getElementById("celebrateCard");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var rafId = null, particles = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  var GOLD = ["#f5c558", "#ffffff", "#1f7a5c", "#2fae7f", "#d4af37"];

  function resizeCanvas(){
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnFirework(x, y){
    var count = 46;
    var color = GOLD[Math.floor(Math.random() * GOLD.length)];
    for (var i = 0; i < count; i++){
      var ang = (Math.PI * 2) * (i / count);
      var speed = 2.4 + Math.random() * 3.2;
      particles.push({
        x: x, y: y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        life: 1, decay: 0.012 + Math.random() * 0.012, color: color, size: 2 + Math.random() * 2
      });
    }
  }

  function loop(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.globalCompositeOperation = "lighter";
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(function(p){ return p.life > 0; });
    rafId = requestAnimationFrame(loop);
  }

  var fireworkTimer = null;
  function startFireworks(){
    if (reduceMotion) return;
    resizeCanvas();
    if (!rafId) loop();
    function burst(){
      spawnFirework(window.innerWidth * (0.2 + Math.random() * 0.6), window.innerHeight * (0.18 + Math.random() * 0.32));
    }
    burst();
    fireworkTimer = setInterval(burst, 650);
  }
  function stopFireworks(){
    clearInterval(fireworkTimer);
    cancelAnimationFrame(rafId);
    rafId = null;
    particles = [];
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function launchConfetti(){
    confettiWrap.innerHTML = "";
    if (reduceMotion) return;
    var colors = ["#f5c558", "#2fae7f", "#ffffff", "#0e4a3c", "#d4af37"];
    for (var i = 0; i < 70; i++){
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.6 + Math.random() * 2.4) + "s";
      piece.style.animationDelay = (Math.random() * 1.2) + "s";
      piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      confettiWrap.appendChild(piece);
    }
  }

  function addWallChip(text){
    var chip = document.createElement("div");
    chip.className = "wall-chip";
    chip.textContent = "🎉 " + text;
    wall.insertBefore(chip, wall.firstChild);
    while (wall.children.length > 6) wall.removeChild(wall.lastChild);
    if (!reduceMotion){
      var r = chip.getBoundingClientRect();
      spawnFirework(r.left + r.width / 2, r.top + r.height / 2);
    }
  }

  function openCelebration(){
    overlay.classList.add("show");
    frameEl.classList.add("blurred");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(function(){
      overlay.classList.add("open");
      startFireworks();
      launchConfetti();
    });
  }

  function closeCelebration(){
    overlay.classList.remove("open");
    frameEl.classList.remove("blurred");
    document.body.style.overflow = "";
    stopFireworks();
    setTimeout(function(){ overlay.classList.remove("show"); }, 350);
  }

  document.addEventListener("click", function(e){
    if (e.target.closest("[data-celebrate]")) openCelebration();
  });
  document.addEventListener("keydown", function(e){
    var el = document.activeElement;
    if (e.key === "Enter" && el && el.hasAttribute && el.hasAttribute("data-celebrate")) openCelebration();
    if (e.key === "Escape" && overlay.classList.contains("show")) closeCelebration();
  });
  closeBtn.addEventListener("click", closeCelebration);
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closeCelebration();
  });
  window.addEventListener("resize", function(){
    if (overlay.classList.contains("open")) resizeCanvas();
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var text = input.value.trim();
    if (!text) { input.value = "مبروك السعودية كأس خليجي 27 🇸🇦🏆"; return; }
    addWallChip(text);
    input.value = "";
  });

  function ensureHtml2Canvas(then, fail){
    if (window.html2canvas) { then(); return; }
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = then;
    s.onerror = fail;
    document.head.appendChild(s);
  }

  shareBtn.addEventListener("click", function(){
    var old = shareBtn.textContent;
    shareBtn.disabled = true;
    shareBtn.textContent = "⏳ جاري التجهيز…";
    function restore(){ shareBtn.disabled = false; shareBtn.textContent = old; }
    ensureHtml2Canvas(function(){
      html2canvas(card, { backgroundColor: "#0b3328", scale: 2.5, useCORS: true }).then(function(c){
        c.toBlob(function(blob){
          if (!blob) { restore(); return; }
          var file = new File([blob], "mabrouk-ksa.png", { type: "image/png" });
          var shareData = { files: [file], title: "مبروك السعودية 🇸🇦🏆", text: "مبروك السعودية بطلة كأس الخليج العربي «خليجي 27» 🏆🇸🇦" };
          if (navigator.canShare && navigator.canShare(shareData)){
            navigator.share(shareData).catch(function(){}).then(restore);
            return;
          }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "mabrouk-ksa.png";
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
          restore();
        }, "image/png");
      }).catch(restore);
    }, restore);
  });
})();
</script>
