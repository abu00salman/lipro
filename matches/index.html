<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مباريات اليوم — أكاديمية ليبرو الرياضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#123f35;
    --green-700:#1b5e4b;
    --green-600:#20705a;
    --gold-500:#c39a2f;
    --gold-400:#d4ad45;
    --cream:#f7f4ec;
    --ink:#173d33;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Cairo',sans-serif;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(180deg, var(--green-900) 0%, var(--green-700) 45%, #2a7a5e 100%);
    min-height:100vh;
    color:var(--ink);
    padding:0 0 48px;
  }

  .frame{
    max-width:520px;
    margin:0 auto;
    background:
      linear-gradient(180deg, #fdfcf8 0%, var(--cream) 100%);
    border-radius:0 0 28px 28px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }

  /* الشريط العلوي المائل */
  .ribbon{
    height:14px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400) 40%, var(--green-700) 40%, var(--green-900));
  }

  header{
    text-align:center;
    padding:28px 24px 8px;
  }
  header img.logo{
    height:110px;
    display:block;
    margin:0 auto 10px;
  }
  .logo-fallback{
    font-weight:900;
    font-size:44px;
    letter-spacing:2px;
    color:var(--green-700);
    line-height:1;
  }
  .logo-fallback small{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--gold-500);
    letter-spacing:6px;
    margin-top:4px;
  }
  .academy-name{
    color:var(--gold-500);
    font-weight:800;
    font-size:20px;
    margin-top:6px;
  }
  .academy-name span{
    display:block;
    color:var(--green-700);
    font-size:12px;
    font-weight:700;
    letter-spacing:4px;
  }

  h1{
    font-size:52px;
    font-weight:900;
    color:var(--green-700);
    text-shadow:0 2px 0 rgba(195,154,47,.35);
    line-height:1.1;
    margin-top:4px;
  }
  .date-pill{
    display:inline-block;
    background:var(--green-700);
    color:#fff;
    font-weight:800;
    font-size:18px;
    padding:6px 26px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:0 3px 0 var(--gold-500);
  }

  main{padding:22px 16px 8px}

  .league{
    background:#fff;
    border:1px solid rgba(27,94,75,.12);
    border-radius:18px;
    margin-bottom:16px;
    padding:10px 10px 6px;
    box-shadow:0 6px 18px rgba(18,63,53,.08);
  }
  .league-head{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400));
    color:#fff;
    font-weight:900;
    font-size:18px;
    border-radius:12px;
    padding:7px 14px;
    margin-bottom:8px;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .league-badge{
    background:#fff;
    color:var(--gold-500);
    font-weight:900;
    font-size:12px;
    min-width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    flex:none;
  }

  .match{
    display:grid;
    grid-template-columns:96px 1fr 64px 1fr;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid rgba(27,94,75,.1);
    border-radius:12px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .time{
    background:var(--gold-500);
    color:#fff;
    font-weight:800;
    font-size:15px;
    text-align:center;
    border-radius:9px;
    padding:4px 0;
    direction:ltr;
  }
  .team{
    font-weight:800;
    font-size:17px;
    text-align:center;
    color:var(--ink);
  }
  .vs{
    background:var(--green-700);
    color:var(--gold-400);
    font-weight:900;
    font-size:14px;
    text-align:center;
    border-radius:8px;
    padding:5px 0;
    clip-path:polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%);
  }

  .empty{
    text-align:center;
    background:#fff;
    border-radius:18px;
    padding:40px 20px;
    font-weight:800;
    font-size:20px;
    color:var(--green-700);
  }

  footer{
    text-align:center;
    padding:14px 16px 26px;
  }
  .site-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--green-700);
    color:#fff;
    font-weight:800;
    font-size:16px;
    padding:9px 26px;
    border-radius:999px;
    direction:ltr;
    box-shadow:0 3px 0 var(--gold-500);
  }

  @media (max-width:420px){
    h1{font-size:42px}
    .match{grid-template-columns:78px 1fr 52px 1fr}
    .team{font-size:15px}
    .time{font-size:13px}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="ribbon"></div>

  <header>
    <!-- ضع شعار الأكاديمية هنا: بدّل src برابط الشعار في موقعك، أو احذف سطر img ليظهر الشعار النصي -->
    <img class="logo" src="/logo.png" alt="ليبرو" onerror="this.remove()">
    <div class="academy-name">أكاديمية ليبرو الرياضية <span>LIPRO ACADEMY</span></div>
    <h1>مباريات اليوم</h1>
    <div class="date-pill" id="today-date"></div>
  </header>

  <main id="leagues"></main>

  <footer>
    <div class="site-pill">🌐 www.liproacademy.com</div>
  </footer>
</div>

<script>
/* ============================================================
   ✏️ التعديل اليومي هنا فقط — لا تلمس أي شيء تحت هذا القسم
   لكل دوري: name (اسم الدوري والجولة) و matches
   لكل مباراة: time ثم home (يمين) ثم away (يسار)
   احذف أو أضف دوريات ومباريات بحرية، والتصميم يتكيف تلقائياً
   ============================================================ */
const LEAGUES = [
  {
    name: "الدوري الإنجليزي الممتاز - الجولة 3",
    badge: "PL",
    matches: [
      { time: "10:00 PM", home: "إيبسويتش تاون", away: "ليفربول" },
    ],
  },
  {
    name: "الدوري الإسباني - الجولة 4",
    badge: "LL",
    matches: [
      { time: "10:00 PM", home: "ريال بيتيس", away: "ريال مدريد" },
    ],
  },
  {
    name: "الدوري الإيطالي - الجولة 3",
    badge: "SA",
    matches: [
      { time: "09:45 PM", home: "جنوى", away: "كومو" },
    ],
  },
  {
    name: "الدوري الفرنسي - الجولة 3",
    badge: "L1",
    matches: [
      { time: "08:00 PM", home: "ليون", away: "أوكسير" },
      { time: "10:05 PM", home: "باريس سان جيرمان", away: "موناكو" },
    ],
  },
  {
    name: "الدوري الألماني - الجولة 2",
    badge: "BL",
    matches: [
      { time: "09:30 PM", home: "شتوتغارت", away: "كولن" },
    ],
  },
  {
    name: "دوري روشن السعودي - الجولة 5",
    badge: "RSL",
    matches: [
      { time: "07:00 PM", home: "أبها", away: "الإتفاق" },
      { time: "09:00 PM", home: "الأهلي", away: "الرياض" },
      { time: "09:00 PM", home: "الشباب", away: "الهلال" },
    ],
  },
];
/* ============================================================
   نهاية قسم التعديل اليومي
   ============================================================ */

// التاريخ يكتب نفسه تلقائياً حسب يوم العرض
document.getElementById("today-date").textContent =
  new Date().toLocaleDateString("ar-SA-u-ca-gregory", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
  });

// بناء البطاقات من البيانات
const root = document.getElementById("leagues");
if (!LEAGUES.length || LEAGUES.every(l => !l.matches.length)) {
  root.innerHTML = '<div class="empty">لا توجد مباريات اليوم — نلقاكم غداً ⚽</div>';
} else {
  for (const league of LEAGUES) {
    if (!league.matches.length) continue;
    const sec = document.createElement("section");
    sec.className = "league";
    sec.innerHTML =
      '<div class="league-head"><span class="league-badge">' + (league.badge || "⚽") + "</span>" +
      "<span>" + league.name + "</span></div>" +
      league.matches.map(m =>
        '<div class="match">' +
        '<div class="time">' + m.time + "</div>" +
        '<div class="team">' + m.home + "</div>" +
        '<div class="vs">VS</div>' +
        '<div class="team">' + m.away + "</div>" +
        "</div>"
      ).join("");
    root.appendChild(sec);
  }
}
</script>

</body>
</html>
