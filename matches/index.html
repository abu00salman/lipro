/* =========================================================
   التاريخ والوقت — السعودية
   ========================================================= */

function riyadhDate(date) {
  var parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Riyadh",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);

  var values = {};
  parts.forEach(function(part) {
    values[part.type] = part.value;
  });

  return values.year + "-" + values.month + "-" + values.day;
}

function updateDateHeading() {
  document.getElementById("today-date").textContent =
    new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {
      timeZone: "Asia/Riyadh",
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(new Date());
}

function riyadhTime12(date) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Riyadh",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }).format(date).toUpperCase();
}

function toMinutes(value) {
  var match = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(
    String(value || "")
  );

  if (!match) return null;

  var hour = Number(match[1]);
  var minute = Number(match[2]);

  if (hour < 1 || hour > 12 || minute > 59) return null;

  hour %= 12;
  if (/PM/i.test(match[3])) hour += 12;

  return hour * 60 + minute;
}

function kickoffTimestamp(date, time) {
  var minutes = toMinutes(time);
  if (minutes === null) return null;

  var hour = String(Math.floor(minutes / 60)).padStart(2, "0");
  var minute = String(minutes % 60).padStart(2, "0");
  var timestamp = Date.parse(
    date + "T" + hour + ":" + minute + ":00+03:00"
  );

  return Number.isFinite(timestamp) ? timestamp : null;
}

function arabicDigits(value) {
  return String(value).replace(/\d/g, function(digit) {
    return "٠١٢٣٤٥٦٧٨٩"[Number(digit)];
  });
}

function displayTime(value) {
  var match = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(
    String(value || "")
  );

  if (!match) return String(value || "لم يحدد");

  return arabicDigits(Number(match[1]) + ":" + match[2]) +
    (/PM/i.test(match[3]) ? " م" : " ص");
}

/* حماية النصوص عند إدراجها داخل الصفحة */
function escapeHTML(value) {
  return String(value == null ? "" : value).replace(
    /[&<>"']/g,
    function(character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character];
    }
  );
}

function safeURL(value) {
  try {
    var url = new URL(String(value || ""), location.href);
    return /^https?:$/.test(url.protocol) ? url.href : "";
  } catch (error) {
    return "";
  }
}

var TEAM_STOP = new Set([
  "al","fc","sc","cf","ac","as","ss","us","ssc","afc",
  "rc","rcd","ud","sd","club","saudi","de","the",
  "fk","sk","bk","if","ol","og","sv","vfl","vfb",
  "tsg","fsv","bsc","sco","stade","calcio",
  "1899","1904","1909","1910","1913","1846","1893","1900"
]);

function teamKey(name) {
  return String(name || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .split(/\s+/)
    .filter(function(word) {
      return word && !TEAM_STOP.has(word);
    })
    .join(" ")
    .trim();
}

var NORMALIZED_TEAM_AR = {};
Object.keys(TEAM_AR).forEach(function(name) {
  NORMALIZED_TEAM_AR[teamKey(name)] = TEAM_AR[name];
});

function arTeam(name, shortName) {
  if (/[\u0600-\u06ff]/.test(String(name || ""))) return name;

  var key = teamKey(name);
  if (NORMALIZED_TEAM_AR[key]) return NORMALIZED_TEAM_AR[key];

  var words = key.split(" ");
  for (var length = words.length - 1; length >= 1; length--) {
    var prefix = words.slice(0, length).join(" ");
    if (NORMALIZED_TEAM_AR[prefix]) return NORMALIZED_TEAM_AR[prefix];
  }

  return shortName || name || "فريق";
}

async function fetchWithTimeout(url, timeout) {
  var controller = new AbortController();
  var timer = setTimeout(function() {
    controller.abort();
  }, timeout || 12000);

  try {
    var response = await fetch(url, {
      cache: "no-store",
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error("http_" + response.status);
    }

    // قراءة الجسم ضمن المهلة نفسها أيضًا.
    return await response.text();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchLeagueDay(code, date) {
  /*
    طلب نطاق يومين بالتوقيت العالمي لتغطية اليوم السعودي،
    ثم تصفية النتائج بتاريخ الرياض أدناه.
  */
  var previousDate = new Date(
    date + "T00:00:00Z"
  );

  previousDate.setUTCDate(previousDate.getUTCDate() - 1);

  var start = previousDate.toISOString().slice(0, 10).replace(/-/g, "");
  var end = date.replace(/-/g, "");

  var url =
    "https://site.api.espn.com/apis/site/v2/sports/soccer/" +
    encodeURIComponent(code) +
    "/scoreboard?dates=" + start + "-" + end +
    "&limit=100";

  var data = JSON.parse(await fetchWithTimeout(url, 12000));

  if (!data || !Array.isArray(data.events)) {
    throw new Error("invalid_scoreboard");
  }

  return data;
}

function readScore(value) {
  if (value && typeof value === "object") {
    value = value.value != null ? value.value : value.displayValue;
  }

  if (value == null || value === "") return null;

  var number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function buildFromEspn(results, today) {
  var leagues = [];

  MATCH_LEAGUES.forEach(function(league, index) {
    var result = results[index];

    if (!result || result.status !== "fulfilled") return;

    var matches = [];
    var seen = new Set();

    result.value.events.forEach(function(event) {
      if (event.id && seen.has(event.id)) return;
      if (event.id) seen.add(event.id);

      var when = new Date(event.date);

      if (!Number.isFinite(when.getTime())) return;
      if (riyadhDate(when) !== today) return;

      var competition = (event.competitions || [])[0] || {};
      var competitors = competition.competitors || [];

      var home = competitors.find(function(item) {
        return item.homeAway === "home";
      }) || competitors[0];

      var away = competitors.find(function(item) {
        return item.homeAway === "away";
      }) || competitors[1];

      if (!home || !away) return;

      var status = event.status || competition.status || {};
      var type = status.type || {};
      var statusName = type.name || "";

      var match = {
        id: event.id,
        date: today,
        time: riyadhTime12(when),
        home: arTeam(
          home.team && home.team.displayName,
          home.team && home.team.shortDisplayName
        ),
        away: arTeam(
          away.team && away.team.displayName,
          away.team && away.team.shortDisplayName
        ),
        kickoff: when.getTime(),
        source: "auto",
        state: type.state || "pre"
      };

      var homeScore = readScore(home.score);
      var awayScore = readScore(away.score);

      if (/POSTPONED/i.test(statusName)) {
        match.note = "مؤجلة";
        match.state = "postponed";
      } else if (/CANCEL/i.test(statusName)) {
        match.note = "ملغاة";
        match.state = "cancelled";
      } else if (/SUSPEND|ABANDON/i.test(statusName)) {
        match.note = "متوقفة";
        match.state = "suspended";
      } else if (/DELAY/i.test(statusName)) {
        match.note = "متأخرة";
        match.state = "delayed";
      } else if (type.state === "in") {
        match.live = true;
        match.minute = /HALFTIME/i.test(statusName)
          ? "استراحة"
          : (status.displayClock || "مباشر");

        if (homeScore !== null && awayScore !== null) {
          match.score = [homeScore, awayScore];
        }
      } else if (type.state === "post" || type.completed === true) {
        match.state = "post";

        if (homeScore !== null && awayScore !== null) {
          match.score = [homeScore, awayScore];
        }
      }

      matches.push(match);
    });

    matches.sort(function(a, b) {
      return a.kickoff - b.kickoff;
    });

    if (matches.length) {
      leagues.push({
        name: league.name,
        badge: league.badge,
        matches: matches
      });
    }
  });

  return leagues;
}

/* =========================================================
   دمج المباريات اليدوية مع منع تكرارها
   ========================================================= */

function mergeExtra(leagues, today) {
  var output = (leagues || []).map(function(league) {
    return Object.assign({}, league, {
      matches: (league.matches || []).slice()
    });
  });

  EXTRA_MATCHES.filter(function(match) {
    return match.date === today;
  }).forEach(function(extra) {
    var league = output.find(function(item) {
      return item.name === extra.league;
    });

    if (!league) {
      league = {
        name: extra.league,
        badge: extra.badge || "⚽",
        featured: !!extra.featured,
        matches: []
      };

      output.unshift(league);
    }

    if (extra.featured) league.featured = true;

    var existing = league.matches.find(function(match) {
      return (
        match.home === extra.home &&
        match.away === extra.away
      ) || (
        match.home === extra.away &&
        match.away === extra.home
      );
    });

    if (existing) {
      // الاحتفاظ بالنتيجة التلقائية وإضافة تفاصيل الملعب والقناة.
      ["venue", "channel", "commentator", "watch"].forEach(function(key) {
        if (extra[key] && !existing[key]) existing[key] = extra[key];
      });

      if (existing.home === extra.home) {
        existing.homeFlag = extra.homeFlag || existing.homeFlag;
        existing.awayFlag = extra.awayFlag || existing.awayFlag;
      } else {
        existing.homeFlag = extra.awayFlag || existing.homeFlag;
        existing.awayFlag = extra.homeFlag || existing.awayFlag;
      }

      return;
    }

    var entry = Object.assign({}, extra, {
      source: "manual",
      kickoff: kickoffTimestamp(extra.date, extra.time)
    });

    delete entry.league;
    delete entry.badge;
    delete entry.featured;

    league.matches.push(entry);
  });

  output.forEach(function(league) {
    league.matches.sort(function(a, b) {
      var first = a.kickoff || kickoffTimestamp(today, a.time) || 0;
      var second = b.kickoff || kickoffTimestamp(today, b.time) || 0;
      return first - second;
    });
  });

  output.sort(function(a, b) {
    return Number(!!b.featured) - Number(!!a.featured);
  });

  return output;
}

/* =========================================================
   المصدر اليدوي الاحتياطي
   يقبل بيانات مؤرخة حتى لا يعرض جدول يوم قديم على أنه اليوم.

   يمكن أن يحتوي /matches-data.js على:
   var MATCHES_DATE = "2026-09-22";
   var LEAGUES = [ ... ];
   ========================================================= */

async function loadManual(today) {
  var code = await fetchWithTimeout("/matches-data.js", 8000);

  // ملف من موقعك نفسه، كما في آلية ملفك الأصلي.
  var shared = new Function(
    code +
    "\n;return {" +
    "leagues: typeof LEAGUES !== 'undefined' ? LEAGUES : null," +
    "date: typeof MATCHES_DATE !== 'undefined' ? MATCHES_DATE : null" +
    "};"
  )();

  if (!shared || !Array.isArray(shared.leagues)) {
    throw new Error("invalid_manual_data");
  }

  var leagues = [];

  shared.leagues.forEach(function(league) {
    var matches = (league.matches || []).filter(function(match) {
      var date = match.date || league.date || shared.date;
      return date === today;
    }).map(function(match) {
      return Object.assign({}, match, {
        date: today,
        source: "manual",
        kickoff: kickoffTimestamp(today, match.time)
      });
    });

    if (matches.length) {
      leagues.push(Object.assign({}, league, {
        matches: matches
      }));
    }
  });

  if (!leagues.length) throw new Error("no_dated_manual_matches");

  return leagues;
}

async function loadData() {
  if (LOADING) return;
  LOADING = true;

  var today = riyadhDate(new Date());

  if (DISPLAY_DATE !== today) {
    DISPLAY_DATE = today;
    LEAGUES = mergeExtra([], today);
    DATA_SOURCE = "loading";
    updateDateHeading();
    render();
  }

  try {
    var results = await Promise.allSettled(
      MATCH_LEAGUES.map(function(league) {
        return fetchLeagueDay(league.code, today);
      })
    );

    // إذا تغيّر اليوم أثناء التحميل، لا نعرض بيانات اليوم السابق.
    if (riyadhDate(new Date()) !== today) return;

    FAILED_COUNT = results.filter(function(result) {
      return result.status === "rejected";
    }).length;

    if (FAILED_COUNT === MATCH_LEAGUES.length) {
      throw new Error("all_sources_failed");
    }

    LEAGUES = mergeExtra(buildFromEspn(results, today), today);
    DATA_SOURCE = FAILED_COUNT ? "partial" : "auto";
  } catch (error) {
    try {
      var manualLeagues = await loadManual(today);

      if (riyadhDate(new Date()) !== today) return;

      LEAGUES = mergeExtra(manualLeagues, today);
      DATA_SOURCE = "manual";
    } catch (manualError) {
      /*
        الإضافات اليدوية المحلية تظهر حتى عند تعذّر
        ESPN وملف matches-data.js معًا.
      */
      if (riyadhDate(new Date()) !== today) return;

      LEAGUES = mergeExtra([], today);
      DATA_SOURCE = "extras";
    }
  } finally {
    LOADING = false;

    if (riyadhDate(new Date()) !== today) {
      refresh();
    } else {
      updateDateHeading();
      render();
    }
  }
}

/* =========================================================
   عرض المباريات
   لا نعتبر المباراة مباشرة لمجرد حلول وقتها.
   ========================================================= */

function hasScore(match) {
  return Array.isArray(match.score) &&
    match.score.length >= 2 &&
    match.score[0] != null &&
    match.score[1] != null;
}

function matchStatus(match) {
  if (match.note) {
    return { text: match.note, className: "ft" };
  }

  if (match.live === true) {
    return {
      text: "● " + (match.minute || "مباشر"),
      className: "live"
    };
  }

  if (match.state === "post" || hasScore(match)) {
    return { text: "انتهت", className: "ft" };
  }

  if (
    match.source === "manual" &&
    match.kickoff &&
    Date.now() >= match.kickoff
  ) {
    return {
      text: displayTime(match.time),
      className: "estimated",
      note: "حلّ موعد المباراة — النتيجة غير متاحة"
    };
  }

  return { text: displayTime(match.time), className: "" };
}

function renderMatch(match, league) {
  var status = matchStatus(match);
  var scoreAvailable = hasScore(match);

  var info =
    MATCH_INFO[match.home + "|" + match.away] ||
    MATCH_INFO[match.away + "|" + match.home] ||
    {};

  if (info.d && info.d !== DISPLAY_DATE) info = {};

  var channel = match.channel || info.ch || CHANNELS[league.name] || "";
  var commentator = match.commentator || info.caster || "";

  var channelHTML = "";

  if (channel || commentator) {
    channelHTML =
      '<div class="chan">' +
      (channel
        ? '<span class="chan__tv">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" ' +
          'fill="none" stroke="currentColor" stroke-width="2.2" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<rect x="2" y="7" width="20" height="13" rx="2"></rect>' +
          '<path d="m8 3 4 4 4-4"></path></svg>' +
          '<bdi>' + escapeHTML(channel) + '</bdi></span>'
        : "") +
      (commentator
        ? '<span class="chan__mic">🎙 المعلق: ' +
          escapeHTML(commentator) + '</span>'
        : "") +
      '</div>';
  }

  var watchHTML = "";

  if (match.watch) {
    var links = Array.isArray(match.watch) ? match.watch : [match.watch];

    var buttons = links.map(function(link, index) {
      if (!link || typeof link !== "object") return "";

      var url = safeURL(link.url);
      if (!url) return "";

      return '<a class="watch' + (index ? ' watch--alt' : '') +
        '" href="' + escapeHTML(url) +
        '" target="_blank" rel="noopener noreferrer">' +
        escapeHTML(link.label || "المشاهدة") + '</a>';
    }).join("");

    if (buttons) watchHTML = '<div class="watch-wrap">' + buttons + '</div>';
  }

  /*
    ترتيب النتيجة من اليمين:
    أهداف الفريق الموجود يمين البطاقة ثم أهداف الفريق الأيسر.
  */
  var middle = scoreAvailable
    ? '<div class="vs score" aria-label="' +
      escapeHTML(match.home + " " + match.score[0] +
      " - " + match.score[1] + " " + match.away) + '">' +
      '<span>' + escapeHTML(match.score[0]) + '</span>' +
      '<span aria-hidden="true">-</span>' +
      '<span>' + escapeHTML(match.score[1]) + '</span></div>'
    : '<div class="vs" dir="ltr">VS</div>';

  return '<div class="match">' +
    '<div class="time ' + status.className + '">' +
      escapeHTML(status.text) +
    '</div>' +

    '<div class="team">' +
      (match.homeFlag
        ? '<span class="team-flag" aria-hidden="true">' +
          escapeHTML(match.homeFlag) + '</span>'
        : "") +
      escapeHTML(match.home) +
    '</div>' +

    middle +

    '<div class="team">' +
      (match.awayFlag
        ? '<span class="team-flag" aria-hidden="true">' +
          escapeHTML(match.awayFlag) + '</span>'
        : "") +
      escapeHTML(match.away) +
    '</div>' +

    (match.venue
      ? '<div class="venue">📍 ' + escapeHTML(match.venue) + '</div>'
      : "") +

    (status.note
      ? '<div class="match-note">' + escapeHTML(status.note) + '</div>'
      : "") +

    channelHTML +
    watchHTML +
  '</div>';
}

function render() {
  var root = document.getElementById("leagues");
  var status = document.getElementById("data-status");

  var visible = LEAGUES.filter(function(league) {
    return Array.isArray(league.matches) && league.matches.length;
  });

  if (!visible.length) {
    var message = "لا توجد مباريات اليوم في البطولات المعروضة ⚽";

    if (DATA_SOURCE === "loading") {
      message = "جاري تحميل مباريات اليوم…";
    } else if (DATA_SOURCE === "extras" || DATA_SOURCE === "partial") {
      message = "تعذّر تحميل جدول المباريات كاملًا، سيُعاد التحديث تلقائيًا.";
    }

    root.innerHTML = '<div class="empty">' + escapeHTML(message) + '</div>';
  } else {
    root.innerHTML = visible.map(function(league) {
      return '<section class="league' +
        (league.featured ? ' league--featured' : '') + '">' +
        '<h2 class="league-head">' +
          '<span class="league-badge">' +
            escapeHTML(league.badge || "⚽") +
          '</span>' +
          '<span>' + escapeHTML(league.name) + '</span>' +
        '</h2>' +
        league.matches.map(function(match) {
          return renderMatch(match, league);
        }).join("") +
      '</section>';
    }).join("");
  }

  var messages = {
    loading: "جاري تحميل بقية مباريات اليوم…",
    auto: "",
    partial: "تعذّر تحميل بعض البطولات، وقد يكون الجدول غير مكتمل.",
    manual: "تعذّر التحديث المباشر؛ المعروض هو الجدول اليدوي المؤرّخ لليوم.",
    extras: "تعذّر تحميل المصدر التلقائي؛ المعروض حاليًا هو المباريات المضافة يدويًا."
  };

  status.textContent = messages[DATA_SOURCE] || "";
}

/* =========================================================
   التحديث التلقائي
   ========================================================= */

function scheduleRefresh() {
  clearTimeout(REFRESH_TIMER);

  var needsFastRefresh = LEAGUES.some(function(league) {
    return league.matches.some(function(match) {
      if (match.live === true) return true;
      if (match.note || match.state === "post" || hasScore(match)) return false;

      var kickoff = match.kickoff ||
        kickoffTimestamp(DISPLAY_DATE, match.time);

      if (!kickoff) return false;

      var difference = Date.now() - kickoff;
      return difference >= -60000 && difference <= 3 * 60 * 60 * 1000;
    });
  });

  REFRESH_TIMER = setTimeout(
    refresh,
    needsFastRefresh ? 60000 : 300000
  );
}

async function refresh() {
  if (LOADING) return;
  clearTimeout(REFRESH_TIMER);
  await loadData();
  scheduleRefresh();
}

document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    updateDateHeading();
    refresh();
  }
});

window.addEventListener("online", refresh);

/* عرض مباراة المنتخب فورًا ثم تحميل بقية البطولات */
updateDateHeading();
LEAGUES = mergeExtra([], DISPLAY_DATE);
DATA_SOURCE = "loading";
render();
refresh();

/* =========================================================
   حفظ ومشاركة الجدول كصورة
   ========================================================= */

var canvasLibraryPromise = null;

function loadCanvasLibrary() {
  if (window.html2canvas) return Promise.resolve();

  if (!canvasLibraryPromise) {
    canvasLibraryPromise = new Promise(function(resolve, reject) {
      var script = document.createElement("script");

      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

      script.onload = function() {
        if (window.html2canvas) {
          resolve();
        } else {
          reject(new Error("canvas_library_missing"));
        }
      };

      script.onerror = function() {
        script.remove();
        canvasLibraryPromise = null;
        reject(new Error("canvas_library_failed"));
      };

      document.head.appendChild(script);
    });
  }

  return canvasLibraryPromise;
}

function downloadBlob(blob) {
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");

  link.href = url;
  link.download = "lipro-matches-" + DISPLAY_DATE + ".png";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 30000);
}

document.getElementById("shareBtn").addEventListener("click", async function() {
  var button = this;
  var originalText = button.textContent;

  button.disabled = true;
  button.textContent = "⏳ جاري التجهيز…";

  try {
    await loadCanvasLibrary();

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    var frame = document.querySelector(".frame");

    await Promise.all(
      Array.from(frame.images || frame.querySelectorAll("img")).map(function(img) {
        if (img.complete) return Promise.resolve();

        return new Promise(function(resolve) {
          var timer = setTimeout(resolve, 5000);

          function finish() {
            clearTimeout(timer);
            resolve();
          }

          img.addEventListener("load", finish, { once: true });
          img.addEventListener("error", finish, { once: true });
        });
      })
    );

    var width = Math.max(1, frame.scrollWidth);
    var height = Math.max(1, frame.scrollHeight);

    /*
      تقييد مساحة الصورة وأبعادها لتقليل مشاكل
      الصفحات الطويلة، خصوصًا على الآيفون.
    */
    var maxPixels = 12000000;
    var maxDimension = 16000;

    var scale = Math.min(
      3,
      window.devicePixelRatio || 1,
      Math.sqrt(maxPixels / (width * height)),
      maxDimension / width,
      maxDimension / height
    );

    var canvas = await html2canvas(frame, {
      backgroundColor: "#f7f4ec",
      scale: scale,
      useCORS: true,
      allowTaint: false,
      imageTimeout: 12000,
      windowWidth: document.documentElement.clientWidth,
      ignoreElements: function(element) {
        return element.classList &&
          element.classList.contains("topbar");
      }
    });

    var blob = await new Promise(function(resolve, reject) {
      canvas.toBlob(function(result) {
        if (result) resolve(result);
        else reject(new Error("empty_image"));
      }, "image/png");
    });

    var file = new File(
      [blob],
      "lipro-matches-" + DISPLAY_DATE + ".png",
      { type: "image/png" }
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      try {
        await navigator.share({
          files: [file],
          title: "مباريات اليوم — أكاديمية ليبرو الرياضية"
        });
      } catch (shareError) {
        if (shareError.name !== "AbortError") {
          downloadBlob(blob);
        }
      }
    } else {
      downloadBlob(blob);
    }
  } catch (error) {
    alert("تعذّر تجهيز الصورة. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.");
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
});

  left: -80px;
  width: 260px;
  height: 260px;
  box-shadow:
    0 0 0 20px rgba(222,193,112,.04),
    0 0 0 40px rgba(222,193,112,.03);
}

.national-offer__occasion {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid rgba(234,209,146,.4);
  border-radius: 999px;
  background: rgba(255,255,255,.07);
  color: #f3dfac;
  font-size: 12px;
  font-weight: 800;
}

.national-offer__occasion strong {
  font-size: 20px;
  line-height: 1.4;
}

.national-offer h2 {
  margin-top: 17px;
  color: #fff;
  font-size: clamp(25px, 7vw, 33px);
  font-weight: 900;
  line-height: 1.5;
}

.national-offer__subtitle {
  margin-top: 3px;
  color: #dfebe2;
  font-size: 13px;
  font-weight: 600;
}

.national-offer__price {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  color: #eed18b;
}

.national-offer__price strong {
  font-size: clamp(70px, 20vw, 94px);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -3px;
}

.national-offer__price span {
  font-size: 22px;
  font-weight: 800;
}

.national-offer__duration {
  display: inline-block;
  padding: 3px 23px;
  border-radius: 9px;
  background: rgba(255,255,255,.09);
  color: #fff;
  font-size: 21px;
  font-weight: 800;
}

.national-offer__tabby {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 17px;
  color: #e5eee7;
  font-size: 13px;
  font-weight: 700;
}

.national-offer__tabby b {
  padding: 2px 11px;
  background: #b8f5cf;
  color: #123f35;
  border-radius: 7px;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: 800;
}

.national-offer__cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 50px;
  margin-top: 22px;
  padding: 11px 16px;
  border: 1px solid #f0d899;
  border-radius: 13px;
  background: linear-gradient(110deg, #e3bd64, #f2dca5);
  color: #123f35;
  text-decoration: none;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 5px 14px rgba(0,0,0,.12);
  transition: filter .2s ease;
}

.national-offer__cta:hover {
  filter: brightness(1.06);
}

.national-offer__phone {
  display: inline-block;
  margin-top: 13px;
  color: #e2ebe4;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  direction: ltr;
  letter-spacing: 1px;
}
</style>

<script>
(function () {
  /* منع تكرار الإضافة */
  if (document.getElementById("nationalOffer96")) return;

  var header = document.querySelector(".frame header");
  var footer = document.querySelector(".frame footer");

  if (!header || !footer) return;

  /* شارة اليوم الوطني — لمسة تصميمية وليست شعارًا رسميًا */
  var badge = document.createElement("div");
  badge.className = "national-badge";
  badge.innerHTML =
    '<span aria-hidden="true">🇸🇦</span>' +
    '<span>اليوم الوطني السعودي</span>' +
    '<strong>٩٦</strong>';

  header.appendChild(badge);

  /* رسالة الاشتراك */
  var message =
    "السلام عليكم، أرغب بالاشتراك في أكاديمية ليبرو " +
    "بعرض اليوم الوطني 96: شهرين بـ296 ريال.";

  var whatsappURL =
    "https://wa.me/966530634750?text=" +
    encodeURIComponent(message);

  /* بطاقة العرض أسفل المباريات */
  var offer = document.createElement("section");
  offer.id = "nationalOffer96";
  offer.className = "national-offer";
  offer.setAttribute("aria-labelledby", "nationalOfferTitle");

  offer.innerHTML =
    '<div class="national-offer__occasion">' +
      '<span>بمناسبة اليوم الوطني السعودي</span>' +
      '<strong>٩٦</strong>' +
    '</div>' +

    '<h2 id="nationalOfferTitle">اشترك الآن في ليبرو</h2>' +
    '<p class="national-offer__subtitle">' +
      'احتفل معنا… وخَلّ موهبتك تكبر' +
    '</p>' +

    '<div class="national-offer__price">' +
      '<strong>٢٩٦</strong>' +
      '<span>ريال</span>' +
    '</div>' +

    '<div class="national-offer__duration">لمدة شهرين</div>' +

    '<div class="national-offer__tabby">' +
      '<span>وتقدر تقسّطها عبر تابي</span>' +
      '<b dir="ltr">tabby</b>' +
    '</div>' +

    '<a class="national-offer__cta" ' +
      'href="' + whatsappURL + '" ' +
      'target="_blank" rel="noopener noreferrer">' +
      'اشترك الآن عبر الواتساب' +
      '<span aria-hidden="true">↗</span>' +
    '</a>' +

    '<a class="national-offer__phone" href="tel:+966530634750">' +
      '0530634750' +
    '</a>';

  footer.parentNode.insertBefore(offer, footer);
})();
</script>
</body>
</html>
