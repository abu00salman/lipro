<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مباريات اليوم — أكاديمية ليبرو الرياضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#123f35;
    --green-700:#1b5e4b;
    --green-600:#20705a;
    --gold-500:#c39a2f;
    --gold-400:#d4ad45;
    --cream:#f7f4ec;
    --ink:#173d33;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Cairo',sans-serif;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(180deg, var(--green-900) 0%, var(--green-700) 45%, #2a7a5e 100%);
    min-height:100vh;
    color:var(--ink);
    padding:0 0 48px;
  }

  .frame{
    max-width:520px;
    margin:0 auto;
    background:
      linear-gradient(180deg, #fdfcf8 0%, var(--cream) 100%);
    border-radius:0 0 28px 28px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }

  /* الشريط العلوي المائل */
  .ribbon{
    height:14px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400) 40%, var(--green-700) 40%, var(--green-900));
  }

  .topbar{padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    color:var(--green-700);
    font-weight:800;
    font-size:14px;
    text-decoration:none;
    border:1px solid rgba(27,94,75,.25);
    border-radius:999px;
    padding:6px 16px;
    box-shadow:0 2px 6px rgba(18,63,53,.08);
  }
  .share-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:linear-gradient(90deg,var(--gold-500),var(--gold-400));
    color:#fff;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:7px 16px;
    box-shadow:0 2px 6px rgba(18,63,53,.15);
  }
  .share-btn:disabled{opacity:.65;cursor:wait}
  .time.live{background:#e8453f;animation:lp-pulse 1.4s ease-in-out infinite}
  @keyframes lp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
  header{
    text-align:center;
    padding:28px 24px 8px;
  }
  header img.logo{
    height:110px;
    display:block;
    margin:0 auto 10px;
  }
  .logo-fallback{
    font-weight:900;
    font-size:44px;
    letter-spacing:2px;
    color:var(--green-700);
    line-height:1;
  }
  .logo-fallback small{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--gold-500);
    letter-spacing:6px;
    margin-top:4px;
  }
  .academy-name{
    color:var(--gold-500);
    font-weight:800;
    font-size:20px;
    margin-top:6px;
  }
  .academy-name span{
    display:block;
    color:var(--green-700);
    font-size:12px;
    font-weight:700;
    letter-spacing:4px;
  }

  h1{
    font-size:52px;
    font-weight:900;
    color:var(--green-700);
    text-shadow:0 2px 0 rgba(195,154,47,.35);
    line-height:1.1;
    margin-top:4px;
  }
  .date-pill{
    display:inline-block;
    background:var(--green-700);
    color:#fff;
    font-weight:800;
    font-size:18px;
    padding:6px 26px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:0 3px 0 var(--gold-500);
  }

  main{padding:22px 16px 8px}

  .league{
    background:#fff;
    border:1px solid rgba(27,94,75,.12);
    border-radius:18px;
    margin-bottom:16px;
    padding:10px 10px 6px;
    box-shadow:0 6px 18px rgba(18,63,53,.08);
  }
  .league-head{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400));
    color:#fff;
    font-weight:900;
    font-size:18px;
    border-radius:12px;
    padding:7px 14px;
    margin-bottom:8px;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .league-badge{
    background:#fff;
    color:var(--gold-500);
    font-weight:900;
    font-size:12px;
    min-width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    flex:none;
  }

  .match{
    display:grid;
    grid-template-columns:96px 1fr 64px 1fr;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid rgba(27,94,75,.1);
    border-radius:12px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .time{
    background:var(--gold-500);
    color:#fff;
    font-weight:800;
    font-size:15px;
    text-align:center;
    border-radius:9px;
    padding:4px 0;
    direction:ltr;
  }
  .team{
    font-weight:800;
    font-size:17px;
    text-align:center;
    color:var(--ink);
  }
  .vs{
    background:var(--green-700);
    color:var(--gold-400);
    font-weight:900;
    font-size:14px;
    text-align:center;
    border-radius:8px;
    padding:5px 0;
    clip-path:polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%);
  }
  .time.ft{background:var(--green-700)}
  .vs.score{font-size:15px;letter-spacing:1px}

  .empty{
    text-align:center;
    background:#fff;
    border-radius:18px;
    padding:40px 20px;
    font-weight:800;
    font-size:20px;
    color:var(--green-700);
  }

  footer{
    text-align:center;
    padding:14px 16px 26px;
  }
  .site-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--green-700);
    color:#fff;
    font-weight:800;
    font-size:16px;
    padding:9px 26px;
    border-radius:999px;
    direction:ltr;
    box-shadow:0 3px 0 var(--gold-500);
  }

  @media (max-width:420px){
    h1{font-size:42px}
    .match{grid-template-columns:78px 1fr 52px 1fr}
    .team{font-size:15px}
    .time{font-size:13px}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="ribbon"></div>

  <div class="topbar">
    <a class="back-btn" href="/">🏠 العودة للرئيسية</a>
    <button class="share-btn" id="shareBtn" type="button">📤 حفظ / مشاركة</button>
  </div>

  <header>
    <!-- ضع شعار الأكاديمية هنا: بدّل src برابط الشعار في موقعك، أو احذف سطر img ليظهر الشعار النصي -->
    <img class="logo" src="/logo-lipro.png" alt="ليبرو" onerror="this.remove()">
    <div class="academy-name">أكاديمية ليبرو الرياضية <span>LIPRO ACADEMY</span></div>
    <h1>مباريات اليوم</h1>
    <div class="date-pill" id="today-date"></div>
  </header>

  <main id="leagues"></main>

  <footer>
    <div class="site-pill">🌐 www.liproacademy.com</div>
  </footer>
</div>

<script>
document.getElementById("today-date").textContent =
  new Date().toLocaleDateString("ar-SA-u-ca-gregory", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
  });

/* الوقت الحالي بتوقيت الرياض — لكشف المباريات الجارية الآن */
function riyadhNow(){
  try { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Riyadh" })); }
  catch (e) { return new Date(); }
}

/* "09:00 PM" → دقائق من بداية اليوم */
function toMinutes(t){
  var m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(String(t || ""));
  if (!m) return null;
  var h = Number(m[1]) % 12;
  if (/pm/i.test(m[3])) h += 12;
  return h * 60 + Number(m[2]);
}

/* مباراة بلا نتيجة وبين انطلاقها ونهايتها التقريبية = جارية الآن.
   ومباراة معها score و live:true = نتيجة مباشرة أثناء اللعب. */
var LIVE_WINDOW_MIN = 115;
function isLiveNow(m){
  if (Array.isArray(m.score)) return m.live === true;
  var start = toMinutes(m.time);
  if (start == null) return false;
  var now = riyadhNow();
  var diff = (now.getHours() * 60 + now.getMinutes()) - start;
  return diff >= 0 && diff <= LIVE_WINDOW_MIN;
}

/* تحميل البيانات بلا أي تخزين مؤقت — أحدث نسخة في كل زيارة */
var LEAGUES = [];
function loadData(then){
  fetch("/matches-data.js", { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(code){
      var shared = new Function(code + "\n;return (typeof LEAGUES !== 'undefined') ? LEAGUES : null;")();
      if (shared) LEAGUES = shared;
    })
    .catch(function(){ /* تعذّر الجلب — نبقي آخر بيانات معروضة */ })
    .then(then);
}
loadData(render);

function render(){
  var root = document.getElementById("leagues");
  root.innerHTML = "";
  var ok = LEAGUES.length && LEAGUES.some(function(l){ return l.matches.length; });
  if (!ok) {
    root.innerHTML = '<div class="empty">لا توجد مباريات اليوم — نلقاكم غداً ⚽</div>';
    return;
  }
  LEAGUES.forEach(function(league){
    if (!league.matches.length) return;
    var sec = document.createElement("section");
    sec.className = "league";
    sec.innerHTML =
      '<div class="league-head"><span class="league-badge">' + (league.badge || "⚽") + "</span>" +
      "<span>" + league.name + "</span></div>" +
      league.matches.map(function(m){
        var done = Array.isArray(m.score);
        var live = isLiveNow(m);
        var timeCell = live
          ? '<div class="time live">● مباشر</div>'
          : done
            ? '<div class="time ft">انتهت</div>'
            : '<div class="time">' + m.time + "</div>";
        var midCell = done
          ? '<div class="vs score" dir="ltr">' + m.score[1] + " - " + m.score[0] + "</div>"
          : '<div class="vs">VS</div>';
        return '<div class="match">' + timeCell +
          '<div class="team">' + m.home + "</div>" + midCell +
          '<div class="team">' + m.away + "</div></div>";
      }).join("");
    root.appendChild(sec);
  });
}

/* تحديث تلقائي كل ٣ دقائق: نتائج وحالة "مباشر" بلا إعادة تحميل */
setInterval(function(){ loadData(render); }, 180000);

/* ===== حفظ / مشاركة الجدول كصورة ===== */
document.getElementById("shareBtn").addEventListener("click", function(){
  var btn = this;
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ جاري التجهيز…";
  function restore(){ btn.disabled = false; btn.textContent = old; }

  function capture(){
    html2canvas(document.querySelector(".frame"), {
      backgroundColor: "#f7f4ec",
      scale: 2,
      useCORS: true,
      ignoreElements: function(el){ return el.classList && el.classList.contains("topbar"); }
    }).then(function(canvas){
      canvas.toBlob(function(blob){
        if (!blob) { restore(); return; }
        var file = new File([blob], "lipro-matches.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "مباريات اليوم — أكاديمية ليبرو الرياضية" })
            .catch(function(){})
            .then(restore);
        } else {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "lipro-matches.png";
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
          restore();
        }
      }, "image/png");
    }).catch(restore);
  }

  if (window.html2canvas) { capture(); }
  else {
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = capture;
    s.onerror = restore;
    document.head.appendChild(s);
  }
});
</script>

</body>
</html>
