name: Backend tests

on:
  pull_request:
    paths: ['backend/**', 'manager/**', 'register/**', 'assets/lipro-checkout.js']
  push:
    branches: [main]
    paths: ['backend/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
