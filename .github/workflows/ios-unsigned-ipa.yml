name: iOS unsigned IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project LiproAcademy.xcodeproj \
            -scheme LiproAcademy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiproAcademy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d "$RUNNER_TEMP/LiproAcademy.xcarchive/Products/Applications/LiproAcademy.app"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/LiproAcademy.xcarchive/Products/Applications/LiproAcademy.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/ios/LiproAcademy-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/ios/LiproAcademy-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiproAcademy-unsigned-ipa
          path: ios/LiproAcademy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
