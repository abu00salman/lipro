<style>
  .status-box{max-width:460px;margin:0 auto}
  .status-form{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:26px 24px;
  }
  .status-form label{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:9px}
  .status-form input{
    width:100%;padding:13px 15px;border-radius:11px;font-family:var(--display);font-size:16px;
    background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);
    direction:ltr;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .status-form input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,37,.2)}
  .status-form .btn{width:100%;margin-top:16px}
  .status-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7}

  .result-card{
    margin-top:22px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;display:none;
  }
  .result-card.is-shown{display:block}
  .result-card__top{padding:26px 22px;text-align:center}
  .result-card__icon{
    width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
    display:grid;place-items:center;
  }
  .result-card__icon--pending{background:rgba(245,179,37,.15);color:var(--gold)}
  .result-card__icon--ok{background:rgba(14,122,107,.12);color:var(--teal)}
  [data-mode="dark"] .result-card__icon--ok{background:rgba(23,168,143,.16);color:var(--teal-lit)}
  .result-card__icon--bad{background:rgba(214,69,69,.12);color:#D64545}
  .result-card__title{font-size:19px;font-family:var(--display);font-weight:800}
  .result-card__sub{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.7}
  .result-card dl{margin:0;padding:18px 22px;background:var(--surface-2);display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:14.5px}
  .result-card dt{color:var(--muted);font-size:13px}
  .result-card dd{margin:0;font-weight:600;text-align:end}
</style>

    var card = $('#resultCard');

    var isReg = /^LPA-\d{4}-[A-Z0-9]{5,10}$/.test(ref);
    var isOrder = /^LPS-\d{4}-[A-Z0-9]{5,10}$/.test(ref);

    if (!isReg && !isOrder) {
      showError('رقم غير صحيح', 'تأكد من كتابة الرقم كاملًا — تسجيل الأكاديمية مثل LPA-2026-AB12C، أو طلب المتجر مثل LPS-2026-AB12C.');
      return;
    }

    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'جاري التحقق…';

    try {
      if (isReg) {
        var out = await LC.Api.registration(ref);
        var r = out.registration;
        var s = STATUS_REG[r.registration_status] || STATUS_REG.pending_payment;

        card.className = 'result-card is-shown';
        $('#resultIcon').className = 'result-card__icon result-card__icon--' + s.cls;
        $('#resultIcon').innerHTML = ICONS[s.icon];
        $('#resultTitle').textContent = s.title;
        $('#resultSub').textContent = s.sub;
        showDetails([['اللاعب', r.player_name || '—'], ['البرنامج', r.program_name || '—'], ['الفرع', r.branch_name || '—']]);
      } else {
        var outO = await LC.Api.order(ref);
        var o = outO.order;
        var sO = STATUS_ORDER[o.order_status] || STATUS_ORDER.new;

        card.className = 'result-card is-shown';
        $('#resultIcon').className = 'result-card__icon result-card__icon--' + sO.cls;
        $('#resultIcon').innerHTML = ICONS[sO.icon];
        $('#resultTitle').textContent = sO.title;
        $('#resultSub').textContent = sO.sub;

        var itemsText = (o.items || []).map(function(it){
          return it.name + (it.variant_label ? ' (' + it.variant_label + ')' : '') + ' ×' + it.qty;
        }).join('، ') || '—';
        showDetails([['المنتجات', itemsText], ['المدينة', o.city || '—'], ['الإجمالي', o.amount_sar + ' ريال']]);
      }
    } catch (e) {
      showError('لم نجد هذا الرقم', 'تأكد من الرقم، أو تواصل معنا على واتساب للمساعدة.');
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }

  $('#checkBtn').addEventListener('click', check);
  $('#refInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); check(); } });

  // دعم فتح الصفحة مباشرة برابط يحمل الرقم: status/?ref=LPA-... أو LPS-...
  var q = new URLSearchParams(location.search);
  if (q.get('ref')) { $('#refInput').value = q.get('ref'); check(); }
})();
</script>
</body>
</html>
